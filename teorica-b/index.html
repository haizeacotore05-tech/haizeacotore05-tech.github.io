<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4f9f">
<meta name="description" content="Estudia el teórico del permiso B: apuntes, tests DGT, simulacro, señales y tarjetas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teórica B">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Teórica Permiso B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: panel lateral de temas tipo cartel de carretera + área de estudio con pestañas Apuntes / Test / Tarjetas */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#e7ecf4; --line:#d2d9e5;
  --fg:#15213a; --muted:#56637a;
  --sign:#1d4f9f; --sign-ink:#ffffff; --sign-soft:#dde7f7;
  --amber:#b7790a; --amber-bg:#fcf1d6; --amber-line:#ecc560;
  --red:#c02a2a; --red-bg:#fbe6e6; --green:#1c7f46; --green-bg:#e0f2e7;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#141d2e; --surface-2:#1b2740; --line:#29375a;
  --fg:#e6ebf4; --muted:#9ba8c0;
  --sign:#6694e8; --sign-ink:#0b1322; --sign-soft:#1e2d4d;
  --amber:#f0bb47; --amber-bg:#322813; --amber-line:#6b5420;
  --red:#f07272; --red-bg:#3a1b1f; --green:#55c98b; --green-bg:#12301f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#141d2e; --surface-2:#1b2740; --line:#29375a;
  --fg:#e6ebf4; --muted:#9ba8c0;
  --sign:#6694e8; --sign-ink:#0b1322; --sign-soft:#1e2d4d;
  --amber:#f0bb47; --amber-bg:#322813; --amber-line:#6b5420;
  --red:#f07272; --red-bg:#3a1b1f; --green:#55c98b; --green-bg:#12301f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.1;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.plate{width:38px;height:38px;border-radius:8px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:26px;box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--sign)}
.brand b{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.iconbtn:hover{background:var(--surface-2)}
.menubtn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100% - 59px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px 40px;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto}
.side h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;font-size:15px}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--sign-soft);color:var(--fg)}
.nav .n{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--sign);text-align:center}
.nav .pc{font-size:12px;color:var(--muted)}
.nav .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menubtn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);height:100%;z-index:50;transform:translateX(-102%);transition:transform .2s ease;
    padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px))}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:40}
  .brand small{display:none}
}

/* Generic */
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--sign)}
.h1{font-size:clamp(30px,5vw,42px);font-weight:700}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .v{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.stat .k{color:var(--muted);font-size:13px;margin-top:4px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.act:hover{border-color:var(--sign)}
.act b{font-family:var(--font-display);font-size:22px}
.act span{color:var(--muted);font-size:14px}
.act.main{background:var(--sign);border-color:var(--sign);color:var(--sign-ink)}
.act.main span{color:var(--sign-ink);opacity:.85}
@media (max-width:640px){.actions{grid-template-columns:minmax(0,1fr)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;text-align:left;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;align-items:start}
.tcard:hover{border-color:var(--sign)}
.badge{width:40px;height:40px;border-radius:8px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px;grid-row:span 2}
.tcard b{font-size:15px;line-height:1.3}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.tcard small{color:var(--muted);font-size:12px}

/* Topic header + tabs */
.thead{display:flex;gap:14px;align-items:center}
.thead .badge{width:54px;height:54px;font-size:28px;grid-row:auto;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--sign)}

/* Notes */
.notes{display:flex;flex-direction:column;gap:18px}
.notes section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.notes h3{font-size:24px;font-weight:700;margin-bottom:8px}
.notes p{margin:0 0 10px;max-width:68ch}
.notes p:last-child{margin-bottom:0}
.notes ul{margin:0 0 10px;padding-left:20px}
.notes li{margin:3px 0}
.notes b{font-weight:700}
.tbl-wrap{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.big{font-family:var(--font-display);font-size:20px;font-weight:700}
.trick,.trap{border-radius:8px;padding:12px 14px;margin:10px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.trick{background:var(--amber-bg);border:1px solid var(--amber-line)}
.trap{background:var(--red-bg);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.trick::before,.trap::before{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;padding:2px 8px;border-radius:4px;margin-top:2px}
.trick::before{content:"TRUCO";background:var(--amber);color:var(--surface)}
.trap::before{content:"TRAMPA";background:var(--red);color:var(--surface)}
.trick p,.trap p{margin:0}

/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qcount{font-family:var(--font-display);font-size:20px;font-weight:600}
.pips{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.pip.x{background:var(--red);border-color:var(--red)}
.pbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sign)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.qtag{font-size:13px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:20px;font-weight:700;line-height:1.4;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt .l{width:32px;height:32px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.opt.sel{border-color:var(--sign);background:var(--sign-soft)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.ok .l{background:var(--green);color:var(--surface)}
.opt.ko{border-color:var(--red);background:var(--red-bg)}
.opt.ko .l{background:var(--red);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px}
.fb.good{background:var(--green-bg)}
.fb.bad{background:var(--red-bg)}
.fb h4{font-size:20px;margin-bottom:4px}
.fb.good h4{color:var(--green)} .fb.bad h4{color:var(--red)}
.fb p{margin:0}
.timer{font-family:var(--font-display);font-size:22px;font-weight:700}
.verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stamp{font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:.06em;padding:4px 18px;border:4px solid;border-radius:10px;transform:rotate(-3deg)}
.stamp.ok{color:var(--green);border-color:var(--green)}
.stamp.ko{color:var(--red);border-color:var(--red)}
.rev{display:flex;flex-direction:column;gap:10px}
.rev .item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.rev .item b{display:block;margin-bottom:4px}
.rev .ans{color:var(--green);font-weight:700}
.rev .yours{color:var(--red)}
.rev p{margin:4px 0 0;color:var(--muted);font-size:15px}

/* Flashcards */
.fcwrap{perspective:1200px}
.flash{position:relative;min-height:260px;border:0;background:none;width:100%;padding:0;transform-style:preserve-3d;transition:transform .45s ease}
.flash.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:left}
.face.front{background:var(--sign);color:var(--sign-ink)}
.face.back{background:var(--surface);border:2px solid var(--sign);transform:rotateY(180deg)}
.face small{font-family:var(--font-display);letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.85}
.face .txt{font-size:22px;font-weight:700;line-height:1.35}
.face.back .txt{font-weight:400;font-size:19px}
.known{color:var(--green);font-weight:700}
@media (prefers-reduced-motion:reduce){.flash,.side{transition:none}}
.empty{color:var(--muted)}
.sims{display:flex;flex-direction:column;gap:6px}
.sims div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px}
.ok-t{color:var(--green);font-weight:700}.ko-t{color:var(--red);font-weight:700}
.kbd{font-size:13px;color:var(--muted)}
.sg{display:block;width:100%;height:auto}
.qimg{display:flex;justify-content:center;margin:-4px 0 16px}.qimg .sg{width:150px}
.mini{float:right;width:56px;margin:0 0 6px 12px}
.fcimg{background:#fff;border-radius:12px;padding:10px;width:132px}
.flash.tall{min-height:340px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0 6px}
.gtile{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.gtile b{display:block;font-size:15px;line-height:1.25}
.gtile small{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em}
.gtile span{display:block;font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
</style>

</head>
<body>
<header class="top">
  <button class="iconbtn menubtn" data-a="menu" aria-label="Abrir temas">Temas</button>
  <button class="brand" data-a="home" aria-label="Inicio">
    <span class="plate">B</span>
    <span><b>Teórica Permiso B</b><small>Intensivo DGT por temas</small></span>
  </button>
  <span class="sp"></span>
  <button class="iconbtn" id="themeBtn" data-a="theme" aria-label="Cambiar tema">Modo oscuro</button>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-a="menu"></div>
  <main><div class="wrap" id="app"></div></main>
</div>

<script>
/* =========================================================
   CONTENIDO: 13 temas · apuntes · preguntas · tarjetas
   Pregunta = [enunciado, correcta, falsa1, falsa2, explicación, señal?]
   ========================================================= */

/* ---------- Señales dibujadas en SVG (lienzo 100 × 100) ---------- */
const C={R:"#c8102e",B:"#1f5fb8",K:"#161616",Y:"#f5c400",G:"#80858d",A:"#4b5059"};
const g=(tf,s)=>`<g transform="${tf}">${s}</g>`;
const RT="translate(50 50) scale(.56) translate(-50 -50)";
const SY={
 arrow:c=>`<path d="M50 6 L77 38 H60 V94 H40 V38 H23Z" fill="${c}"/>`,
 car:c=>`<path d="M24 46 L32 20 H68 L76 46Z" fill="${c}"/><rect x="12" y="44" width="76" height="30" rx="7" fill="${c}"/><rect x="18" y="70" width="14" height="18" rx="3" fill="${c}"/><rect x="68" y="70" width="14" height="18" rx="3" fill="${c}"/><path d="M33 43 L38 26 H62 L67 43Z" fill="#fff"/>`,
 cars:(a,b)=>g("translate(0 24) scale(.5)",SY.car(a))+g("translate(50 24) scale(.5)",SY.car(b)),
 person:c=>`<g fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M54 30 L46 60 L32 92"/><path d="M46 60 L60 74 L58 94"/><path d="M52 38 L36 52"/><path d="M52 38 L66 50"/></g><circle cx="57" cy="15" r="10" fill="${c}"/>`,
 bike:(c,rider)=>`<g fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="72" r="17"/><circle cx="78" cy="72" r="17"/><path d="M22 72 L40 46 H64 L78 72 M40 46 L52 72 L64 46 M36 38 H48 M64 46 L60 36 H70"/>${rider?'<path d="M52 24 L44 44 M52 28 L62 38"/>':""}</g>${rider?`<circle cx="55" cy="14" r="8" fill="${c}"/>`:""}`,
 cow:c=>`<g fill="${c}"><rect x="8" y="36" width="66" height="30" rx="9"/><rect x="12" y="60" width="8" height="28" rx="2"/><rect x="25" y="60" width="8" height="28" rx="2"/><rect x="54" y="60" width="8" height="28" rx="2"/><rect x="66" y="60" width="8" height="28" rx="2"/><path d="M68 34 L86 26 L96 44 L82 54 L68 50Z"/></g><path d="M84 27 L80 16 M89 26 L96 18 M9 40 L3 62" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`,
 loco:c=>`<g fill="${c}"><rect x="10" y="44" width="54" height="26"/><rect x="56" y="22" width="32" height="48"/><rect x="18" y="26" width="10" height="20"/><circle cx="24" cy="78" r="9"/><circle cx="46" cy="78" r="9"/><circle cx="74" cy="78" r="9"/><path d="M10 64 L0 82 H12Z"/></g><rect x="62" y="28" width="20" height="14" fill="#fff"/>`,
 fence:c=>`<g fill="${c}"><rect x="4" y="28" width="92" height="11"/><rect x="4" y="58" width="92" height="11"/><rect x="12" y="18" width="10" height="72"/><rect x="45" y="18" width="10" height="72"/><rect x="78" y="18" width="10" height="72"/></g>`,
 light:()=>`<rect x="32" y="4" width="36" height="92" rx="7" fill="${C.K}"/><circle cx="50" cy="23" r="11" fill="#e2231a"/><circle cx="50" cy="50" r="11" fill="#f2a900"/><circle cx="50" cy="77" r="11" fill="#1f9a4a"/>`,
 curveR:c=>`<path d="M38 96 V62 Q38 34 64 32" fill="none" stroke="${c}" stroke-width="15"/><path d="M60 12 L92 32 L60 52Z" fill="${c}"/>`,
 excl:c=>`<rect x="42" y="6" width="16" height="60" rx="5" fill="${c}"/><circle cx="50" cy="84" r="9" fill="${c}"/>`,
 narrow:c=>`<path d="M24 98 V68 L40 46 V2 M76 98 V68 L60 46 V2" fill="none" stroke="${c}" stroke-width="10"/>`,
 twoWay:c=>g("translate(31 50) scale(.6 .92) translate(-50 -50)",SY.arrow(c))+g("translate(69 50) rotate(180) scale(.6 .92) translate(-50 -50)",SY.arrow(c)),
 slip:c=>g("translate(20 0) scale(.6)",SY.car(c))+`<path d="M36 58 C24 68 46 78 34 94 M64 58 C52 68 74 78 62 94" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`,
 works:c=>`<path d="M62 96 L82 66 L100 96Z" fill="${c}"/><circle cx="28" cy="14" r="10" fill="${c}"/><g fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M32 28 L42 58 L28 94 M42 58 L56 94 M36 38 L58 54"/></g><path d="M50 46 L80 80" stroke="${c}" stroke-width="5"/><path d="M74 72 L90 86 L82 94 L68 80Z" fill="${c}"/>`,
 cross:c=>`<rect x="39" y="2" width="22" height="96" fill="${c}"/><rect x="4" y="44" width="92" height="12" fill="${c}"/>`,

<ul><li>Triangulares, fondo blanco y símbolo negro. Si son luminosas pueden ir al revés: fondo negro y símbolo blanco.</li>

{ short:"Velocidades", title:"Velocidades máximas, mínimas y moderación",
notes:`
<section><h3>Cuadro de velocidades (regla TAC)</h3>
<div class="tbl-wrap"><table><tr><th>Peldaño</th><th>Vehículos</th><th>Autopista / autovía</th><th>Convencional</th></tr>
<tr><td class="big">T</td><td>Turismos y motos, autocaravanas ≤ 3.500 kg, pick-up</td><td class="big">120</td><td class="big">90</td></tr>
<tr><td class="big">A</td><td>Autobuses, mixtos y derivados de turismo</td><td class="big">100</td><td class="big">90</td></tr>
<tr><td class="big">C</td><td>Camiones, furgones, autocaravanas &gt; 3.500 kg y <b>cualquier vehículo con remolque</b></td><td class="big">90</td><td class="big">80</td></tr></table></div>
<div class="trick"><p><b>T-A-C</b>: turismo, autobús, camión. Memoriza 120 y 90 del turismo; desde el autobús (100), resta 10 al ir a la derecha y 10 al bajar un peldaño. Si a tu turismo le pones remolque, bajas al peldaño C.</p></div>
<p><b>Mínimas</b>: autopista y autovía, <b>60</b> para todos. Convencionales: la mitad de la máxima (45, 45 y 40).</p>
</section>
<section><h3>En poblado</h3>
<div class="tbl-wrap"><table><tr><th>Vía urbana</th><th>Máx.</th></tr>
<tr><td>Norma general</td><td class="big">30</td></tr>
<tr><td>Plataforma única (calzada y acera al mismo nivel)</td><td class="big">20</td></tr>
<tr><td>Más de un carril por sentido (si el ayuntamiento lo decide) y travesías</td><td class="big">50</td></tr>
<tr><td>Autopista urbana</td><td class="big">80</td></tr></table></div>
</section>
<section><h3>Otros vehículos</h3>
<div class="tbl-wrap"><table><tr><th>Vehículo</th><th>Máx.</th></tr>
<tr><td>Bicicletas y ciclomotores</td><td class="big">45</td></tr>
<tr><td>Especiales (norma general)</td><td class="big">40</td></tr>
<tr><td>Especiales sin luz de freno o con remolque</td><td class="big">25</td></tr>
<tr><td>Especiales con motor capaz de superar 60</td><td class="big">70</td></tr>
<tr><td>Cuadriciclo ligero (ciclomotor de 4 ruedas)</td><td class="big">45</td></tr>
<tr><td>Cuadriciclo (de motor)</td><td class="big">70</td></tr></table></div>
<p>Estas son <b>genéricas</b>. Prevalecen las <b>específicas</b>: las de las señales, las de tus circunstancias personales o las de la carga.</p>
</section>
<section><h3>Conceptos</h3>
<ul><li>Las máximas se fijan según <b>trazado y tráfico a soportar</b>, para máxima seguridad y fluidez.</li><li><b>Velocidad anormalmente reducida</b> (por debajo de la mínima) solo con causa justificada: transportes y vehículos especiales, acompañamiento a ciclistas, o circunstancias de tráfico, vehículo o vía.</li><li><b>Velocidad adecuada</b> ≠ máxima: ir a 120 con nieve no es exceso, pero es inadecuado.</li><li>Ir rápido: menos control, menos supervivencia, <b>efecto túnel</b> (se estrecha el campo visual), más tensión y fatiga, menos anticipación y menor capacidad de reacción.</li></ul>
</section>
<section><h3>Dónde moderar (y si hace falta, detenerse)</h3>
<p>Ante peatones, ciclistas y animales; con acceso inmediato de edificios a la vía; autobús en parada; vehículos inmovilizados <b>fuera de poblado</b>; pavimento deslizante; riesgo de salpicar agua o gravilla a peatones; intersecciones sin prioridad y pasos a nivel; cruces peligrosos (vehículo grande, vía estrecha); meteorología adversa.</p>
<div class="trap"><p>Señal de peligro + limitación de velocidad en el mismo poste: la limitación <b>acaba con el peligro</b>. Pero peligro + prohibido adelantar no van juntas: la prohibición sigue hasta una señal de fin.</p></div>
<p>Las competiciones en la vía pública están prohibidas sin autorización.</p>
</section>`,
qs:[
["¿Velocidad máxima de un turismo en una carretera convencional?","90 km/h.","100 km/h.","80 km/h.","Peldaño T: 120 en autopista y autovía, 90 en convencional. 100 km/h ya no existe para turismos en convencional, y 80 es la de camiones y vehículos con remolque."],

["¿Velocidad máxima en una autopista urbana?","80 km/h.","50 km/h.","100 km/h.","Una autopista que discurre por poblado baja de 120 a 80. 50 es la de travesías y vías de más de un carril por sentido."],
["¿Máxima de un turismo con remolque en autopista?","90 km/h.","120 km/h.","80 km/h.","Al poner remolque, el turismo pasa al peldaño de camiones: 90 en autopista y 80 en convencional."],
["En el mismo poste hay una señal de peligro y una de velocidad máxima de 40. ¿Hasta dónde se respeta el 40?","Hasta que termine el peligro.","Hasta la señal de fin de limitación.","Hasta la próxima intersección.","Peligro y velocidad trabajan juntas: acaba el peligro, acaba la limitación. Con prohibido adelantar no ocurre así."],
["Se debe moderar especialmente la velocidad al acercarse a vehículos inmovilizados:","Fuera de poblado.","Dentro de poblado.","Solo de noche.","Dentro de poblado es normal ver vehículos parados; fuera de poblado no, por eso ahí se exige moderar."],

["Las velocidades máximas de una vía se establecen según:","El trazado y el tráfico a soportar.","La antigüedad de la vía.","El número de habitantes cercanos.","Más curvas o más tráfico implican vías más lentas, buscando máxima seguridad y fluidez."],
["Circular a 120 km/h por autopista con nieve es:","Una velocidad inadecuada, aunque no sea exceso.","Un exceso de velocidad.","Lo correcto, porque es la máxima.","No supera la máxima, así que no es exceso; pero no se adapta a las circunstancias: es inadecuada."]

{ short:"Maniobras", title:"Maniobras: incorporación, adelantamiento, giros, parada",
notes:`
<section><h3>Antes de cualquier maniobra</h3>
<p>Por este orden: <b>comprobar</b> que se puede, <b>señalizar</b> y <b>ejecutar</b>. Señaliza preferentemente con intermitentes (se mantienen hasta acabar). Con el brazo no hace falta mantenerlo. Si intermitente y brazo se contradicen, <b>prevalece el brazo</b>.</p>
<div class="tbl-wrap"><table><tr><th>Brazo izquierdo</th><th>Significa</th></tr>
<tr><td>Extendido, palma hacia abajo</td><td>Girar a la izquierda</td></tr>
<tr><td>Extendido, palma hacia atrás</td><td>Marcha atrás</td></tr>
<tr><td>Doblado hacia arriba</td><td>Girar a la derecha</td></tr>
<tr><td>Movimiento de arriba abajo</td><td>Voy a frenar fuerte</td></tr></table></div>
<p><b>Claxon</b>: para evitar un accidente, en servicio de urgencia con tu coche (más emergencia y un pañuelo) y para adelantar cuando es obligatorio avisar. Ese último caso, en poblado, solo con ráfagas de luz.</p>
</section>
<section><h3>Incorporación y desplazamiento lateral</h3>
<p>Tiene preferencia quien ya está en la vía (la pública sobre la privada). Quien está debe facilitar la incorporación, sobre todo al autobús desde su parada: en poblado, llegando a detenerse; fuera, sin esa obligación. Los cambios de carril, suaves y progresivos, cediendo a quien ya va por ese carril.</p>
</section>
<section><h3>Adelantamiento</h3>
<p>Señaliza solo si necesitas desplazamiento lateral. Si el de delante también quiere adelantar, tiene preferencia él, salvo que tú ya hayas <b>iniciado</b> la maniobra. Si tarda, avísale (fuera de poblado claxon o ráfagas; dentro, ráfagas). Prohibido adelantar a quien adelanta si hay que invadir el sentido contrario.</p>
<div class="tbl-wrap"><table><tr><th>Separación lateral</th><th>1,5 m</th><th>Proporcional</th></tr>
<tr><td>En poblado</td><td>Ciclos y ciclomotores</td><td>El resto (también motos)</td></tr>
<tr><td>Fuera de poblado</td><td>Vehículos de dos ruedas (también motos), peatones y animales; y siempre que el que adelanta sea de dos ruedas</td><td>El resto</td></tr></table></div>
<p>Vuelve a la derecha cuando veas por el retrovisor interior la parte delantera del adelantado. Si ves peligro, baja la velocidad y vuelve atrás. Si te adelantan: cíñete a la derecha y no aceleres. Los voluminosos que no puedan ceñirse avisan con el brazo o el intermitente derecho de que se puede adelantar.</p>
<p><b>Por la derecha</b>: al que va a girar a la izquierda (sin usar el arcén salvo retenciones), al tranvía por el centro en doble sentido, y en poblado con carriles delimitados. <b>No es adelantamiento</b>: carriles que avanzan distinto en caravana, sobrepasar desde un carril especial y rebasar (al que está parado).</p>
</section>
<section><h3>Dónde está prohibido adelantar</h3>
<div class="tbl-wrap"><table><tr><th>Lugar</th><th>Excepción</th></tr>
<tr><td>Curvas y cambios de rasante sin visibilidad</td><td>Sin invadir el sentido contrario, con sentidos delimitados</td></tr>
<tr><td>Paso de peatones</td><td>Tan despacio que puedas detenerte si hay peligro</td></tr>
<tr><td>Paso para ciclistas</td><td><b>Ninguna</b></td></tr>
<tr><td>Paso a nivel</td><td>A vehículos de dos ruedas</td></tr>
<tr><td>Túneles</td><td>Más de un carril para tu sentido</td></tr>
<tr><td>Intersecciones</td><td>Al que gira a la izquierda por su derecha; rotondas de varios carriles; preferencia señalizada; a vehículos de dos ruedas</td></tr></table></div>
<p>A ciclos, ciclomotores, animales y tracción animal se les puede adelantar en esos lugares, incluso pisando continua, si no hay peligro. También puedes pisar continua para rebasar o esquivar un obstáculo.</p>
</section>
<section><h3>Cambio de sentido y de dirección</h3>
<p><b>Cambio de sentido</b> (media vuelta): solo donde se permite adelantar y en una sola maniobra, sin marcha atrás. Si hay lugar habilitado, ve a él. Si al esperar molestas, espera fuera de la calzada. En autopista y autovía, solo por los lugares habilitados.</p>
<p><b>Cambio de dirección</b> (girar): a la derecha, ceñido a la derecha. A la izquierda: en único sentido, pegado a la izquierda; en doble sentido, ceñido al eje y dejando el centro de la intersección a tu izquierda. Ciclos y ciclomotores fuera de poblado giran a la izquierda desde el arcén.</p>
</section>
<section><h3>Inmovilizaciones</h3>
<div class="tbl-wrap"><table><tr><th>Tipo</th><th>Qué es</th></tr>
<tr><td>Detención</td><td>Involuntaria: avería, tráfico, semáforo o stop</td></tr>
<tr><td>Parada</td><td>Voluntaria, menos de 2 minutos y sin abandonar el vehículo</td></tr>
<tr><td>Estacionamiento</td><td>Voluntaria que no es parada</td></tr></table></div>
<p><b>En túnel</b> — por retención: no abandones, emergencia hasta que tengas a alguien detrás, deja espacio con el de delante y apaga si dura más de 2 min. Por avería: apaga ya, emergencia todo el rato, puedes salir, ve a zona de emergencia o sal del túnel. Incendio delante: deja el coche a la derecha, motor apagado, llave puesta y sin cerrar, y sal a pie.</p>
<p><b>Remolcar averiados</b>: solo grúas. Fuera de autopista y autovía, si no hay grúa, otro vehículo solo hasta el primer lugar seguro.</p>
</section>
<section><h3>Parada y estacionamiento</h3>
<p><b>Fuera de poblado</b>: nunca en calzada ni en arcén transitable; sí en arcén intransitable o su parte intransitable, a la derecha. <b>En poblado</b>: calzada o arcén; doble sentido a la derecha; único sentido a ambos lados. En autopista y autovía solo en áreas habilitadas.</p>
<p><b>Prohibido parar y estacionar</b>: curvas y cambios de rasante sin visibilidad, zonas de movilidad reducida, pasos a nivel, túneles, pasos de peatones, carriles bus/taxi y bici, raíles del tranvía, ocultando señales, paradas de transporte público, intersecciones (en poblado si dificultas el giro; fuera, si quitas visibilidad).</p>
<p><b>Solo prohibido estacionar</b>: OTA sin tique, carga y descarga, aceras, vados y doble fila. Se puede <b>parar en doble fila</b> en poblado si no hay sitio cerca.</p>
<p><b>Grave</b> (parar o estacionar): no dejar 3 m hasta una continua (o al borde opuesto u obstáculo si es discontinua), impedir la incorporación de otro o la salida de un vado, medianas e isletas, pasos rebajados, impedir un giro. <b>Solo el estacionamiento es grave</b> en: carga y descarga, doble fila sin conductor, parada de transporte público, zonas de urgencias, vía de atención preferente en lugar prohibido y en medio de la calzada.</p>
<div class="tbl-wrap"><table><tr><th>Pendiente</th><th>Marcha</th><th>Ruedas contra el bordillo</th></tr>
<tr><td>Ascendente</td><td>Primera</td><td>Hacia el centro de la vía</td></tr>
<tr><td>Descendente</td><td>Marcha atrás</td><td>Hacia el bordillo</td></tr></table></div>
<p>Calzo obligatorio en pendiente: más de 3.500 kg, autobuses y conjuntos (también turismo con remolque). Nunca piedras ni ladrillos; el bordillo sí sirve.</p>
</section>
<section><h3>Marcha atrás</h3>
<p>Dentro de una maniobra (parar, estacionar, incorporarse): <b>máximo 15 m</b> y sin invadir un cruce. Si te quedas bloqueado: el recorrido mínimo imprescindible, pudiendo invadir el cruce con precaución.</p>
</section>`,
qs:[
["Si el intermitente y el brazo indican cosas distintas, ¿qué prevalece?","El brazo.","El intermitente.","Ninguno, hay que repetir la señal.","Preferentemente se señaliza con intermitentes, pero si hay contradicción prevalece el brazo."],
["Brazo izquierdo extendido con la palma hacia atrás significa:","Que va a circular marcha atrás.","Que va a girar a la izquierda.","Que va a frenar fuertemente.","Palma hacia abajo es girar a la izquierda; mover el brazo arriba y abajo es frenar. Palma hacia atrás, marcha atrás."],
["Dentro de poblado, en un caso en que es obligatorio avisar antes de adelantar, debe hacerlo con:","Ráfagas de luz.","El claxon.","El claxon y las ráfagas.","En poblado está prohibido el claxon para adelantar; se sustituye por ráfagas. Fuera de poblado vale cualquiera de los dos."],
["En poblado, ¿qué separación lateral debe dejar al adelantar a una motocicleta?","La proporcional a la anchura y características de la vía.","1,5 m.","1 m.","En poblado el 1,5 m es solo para ciclos y ciclomotores. La moto entra en «el resto»: proporcional."],
["Fuera de poblado, conduce una moto y adelanta a un turismo. ¿Separación lateral?","1,5 m.","La proporcional.","1 m.","Fuera de poblado, si en el adelantamiento interviene un vehículo de dos ruedas, sea el adelantado o el que adelanta, hay que dejar 1,5 m."],
["¿Se puede adelantar en un paso para ciclistas?","No, sin excepción.","Sí, a vehículos de dos ruedas.","Sí, a velocidad muy reducida.","En el paso de peatones hay excepción (velocidad muy reducida) y en el paso a nivel (dos ruedas). En el paso para ciclistas no hay ninguna."],
["Por el carril central de una vía de tres carriles y doble sentido, ¿puede hacer un cambio de sentido?","No.","Sí.","Sí, si no viene nadie.","El carril central solo sirve para adelantar y para cambiar de dirección a la izquierda. Cambiar de sentido desde ahí no se permite."],
["¿Se puede parar en doble fila?","Sí, en poblado y si no hay sitio en las proximidades.","No, nunca.","Sí, en cualquier lugar.","En doble fila está prohibido estacionar, no parar. Parar se admite en poblado cuando no hay hueco cerca."],
["Al estacionar en pendiente descendente, ¿qué marcha deja metida?","Marcha atrás.","Primera.","Punto muerto.","Piensa en lo que le costaría hacer al coche: cuesta abajo le cuesta ir hacia atrás, así que marcha atrás. Cuesta arriba, primera."],
["Detenido en un túnel por una retención, ¿cuándo apaga el motor?","Si la detención dura más de 2 minutos.","Inmediatamente.","Nunca.","Inmediatamente se apaga cuando la detención es por avería. En retención, solo si supera los 2 minutos."],
["Dentro de una maniobra de estacionamiento, ¿cuánto puede recorrer marcha atrás?","Máximo 15 m y sin invadir un cruce.","Máximo 20 m.","Lo que necesite.","«Lo que necesite» (mínimo imprescindible) solo vale cuando estás bloqueado sin otra salida. En maniobras: 15 m y sin cruce."],
["Para considerarse parada, la inmovilización debe:","Durar menos de 2 minutos sin abandonar el vehículo.","Durar menos de 5 minutos.","Ser involuntaria.","La involuntaria es la detención. La parada es voluntaria, de menos de 2 min y sin dejar el vehículo; si no, es estacionamiento."],
["Estacionar en una parada de autobús se sanciona como:","Grave.","Leve.","Muy grave.","En la parada de bus están prohibidas parada y estacionamiento: parar es leve, estacionar es grave."]
],

{ short:"Prioridades", title:"Prioridades de paso e intersecciones",
notes:`
<section><h3>Primero, mira la señal</h3>
<div class="tbl-wrap"><table><tr><th>Te dan preferencia</th><th>Te la quitan</th></tr>
<tr><td><b>Intersección con preferencia</b>: solo en ese cruce.<br><b>Calzada con preferencia</b> (rombo): en todos los cruces hasta la señal de fin.<br>Semáforo en verde.</td>
<td><b>Ceda el paso</b>: si no viene nadie, no hace falta parar.<br><b>Stop</b>: detenerse siempre; si no ves, segunda detención (doble stop).<br>Semáforo en rojo.</td></tr></table></div>
</section>
<section><h3>Sin señal: la derecha libre</h3>
<p>Pasa primero el que tiene la derecha libre. Excepciones:</p>
<ul><li>Vía pavimentada sobre vía sin pavimentar.</li><li>En rotonda sin señales, el que ya está dentro.</li><li>Vías con carril de incorporación (autopista, autovía) sobre quien se incorpora.</li><li>Vehículos sobre raíles (tranvía), vengan por donde vengan.</li></ul>
<div class="trap"><p>La <b>señal gana a la norma</b>. Con calzada con preferencia y un tranvía por la izquierda, pasas tú. Sin la señal, pasaría el tranvía.</p></div>
<p>La señal de intersección sin prioridad equivale a no tener señal: derecha libre. Nunca quedes detenido bloqueando una intersección, paso de peatones o de ciclistas.</p>
</section>
<section><h3>Pasos estrechos: tres escalones</h3>
<ul><li><b>1. Señal</b>: el que tiene la de prohibición (flecha roja) cede; el de la informativa pasa.</li><li><b>2. Sin señal</b>: el que <b>entre primero</b> (no el que llegue primero).</li><li><b>3. No se sabe quién entró</b>: orden por tamaño.</li></ul>
<div class="tbl-wrap"><table><tr><th>Orden</th><th>Vehículo con preferencia</th></tr>
<tr><td class="big">1</td><td>Especiales que exceden masas o dimensiones</td></tr>
<tr><td class="big">2</td><td>Conjuntos de vehículos (salvo turismo con remolque ligero)</td></tr>
<tr><td class="big">3</td><td>Tracción animal (excepción: es difícil hacer retroceder a un caballo)</td></tr>
<tr><td class="big">4</td><td>Turismos con remolque ligero y autocaravanas</td></tr>
<tr><td class="big">5</td><td>Autobuses</td></tr>
<tr><td class="big">6</td><td>Camiones</td></tr>
<tr><td class="big">7</td><td>Turismos</td></tr>
<tr><td class="big">8</td><td>Especiales que no exceden masas ni dimensiones</td></tr>
<tr><td class="big">9</td><td>Vehículos de tres ruedas</td></tr>
<tr><td class="big">10</td><td>Vehículos de dos ruedas</td></tr></table></div>
<p>Si son del mismo tipo: pasa el que tendría que retroceder más; luego el más ancho, el más largo y el de mayor MMA.</p>
<div class="trick"><p>El orden va por <b>tamaño</b>: el grande pasa. Pero no saltes directo al orden: primero señal, luego quién entró.</p></div>
<p><b>Gran pendiente</b> (desde 7 %), sin señal: pasa <b>el que sube</b>, salvo que tenga un apartadero más cerca. <b>En obras</b> (líneas amarillas): obedece la paleta del operario (stop / sentido obligatorio). Los prioritarios en servicio urgente pueden seguir sin detenerse si no hay peligro.</p>
</section>
<section><h3>Pasos a nivel</h3>
<p>Reduce velocidad. No pases con la barrera en movimiento (bajando o subiendo) ni con el semáforo rojo intermitente encendido. Si hay stop, cúmplelo aunque la barrera esté abierta. Si te quedas atrapado: desaloja a las personas, intenta sacar el coche y, si no puedes, avisa al maquinista.</p>
</section>
<section><h3>Peatones, animales y ciclistas</h3>
<p>Por norma general los vehículos tienen preferencia, salvo:</p>
<ul><li>Pasos de peatones.</li><li>Cuando un vehículo cruza el arcén por el que van peatones.</li><li>Cuando el vehículo <b>gira</b> para entrar en otra vía y los peatones <b>ya están cruzando</b>, aunque no haya paso (tienen que darse las dos cosas).</li><li>Zonas peatonales, filas escolares, tropas, y peatones entre el autobús y la acera.</li></ul>
<p>Animales: los mismos casos y además las <b>cañadas</b> (señal de animales domésticos con panel «cañada»).</p>
<p>Ciclistas: pasos y carriles bici; cuando giras y hay ciclistas cerca. Grupo de ciclistas por la izquierda en cruce sin señal: cedes al grupo entero si el primero ya entró en la intersección.</p>
</section>
<section><h3>Vehículos prioritarios</h3>
<p>Policía, ambulancia, bomberos, protección civil y salvamento en servicio urgente: luces rotativas (V-1) y sirena; pueden omitir la <b>sirena</b> si no hay peligro. Pueden saltarse normas bajo su responsabilidad, pero obedecen a los agentes. Un particular en servicio urgente (emergencia, claxon, pañuelo) no puede saltarse nada: solo gana que los demás le dejen paso.</p>
</section>`,

{ short:"Transporte y carga", title:"Transporte de personas y carga",
notes:`
<section><h3>Personas</h3>
<p>No se pueden superar las plazas autorizadas. Pasarse más del 50 % (sin contar al conductor) es muy grave y permite inmovilizar. Prohibido llevar personas en la zona de carga sin autorización.</p>
<p><b>Pasajero en moto o ciclomotor</b> (de dos plazas): mínimo <b>12 años</b>; <b>7</b> si conduce el padre, la madre, el tutor o un mayor de edad autorizado por ellos. A horcajadas, pies en los estribos, con casco y detrás del conductor. En bici de una plaza con sillín homologado: hasta 7 años.</p>
<p>Con pasajero la moto pesa más: aumenta la distancia de frenado, pero hay más adherencia y la rueda trasera se bloquea menos.</p>
<p><b>Moto con remolque</b>: MMA del remolque ≤ 50 % de la masa en vacío de la moto; velocidad −10 % (no −10 km/h); sin personas en el remolque; solo de día y con buen tiempo.</p>
</section>
<section><h3>Dimensiones máximas (incluida la carga)</h3>
<div class="tbl-wrap"><table><tr><th>Alto</th><th>Largo</th><th>Ancho</th></tr><tr><td class="big">4 m</td><td class="big">12 m</td><td class="big">2,55 m</td></tr></table></div>
<p>La carga no puede arrastrarse, caerse ni desplazarse; no puede comprometer la estabilidad, producir ruido o polvo (se tapa con toldos) ni ocultar luces o placas. Un perro es <b>carga</b>: en transportín, detrás de una red separadora o con arnés enganchado al cinturón trasero. Nunca con la cabeza fuera.</p>
</section>
<section><h3>Cuánto puede sobresalir la carga</h3>
<div class="tbl-wrap"><table><tr><th>Vehículo</th><th>Por delante</th><th>Por detrás</th><th>Lateral</th></tr>
<tr><td>Turismo (divisible o indivisible)</td><td>Nada</td><td>10 % divisible · 15 % indivisible</td><td>Nada</td></tr>
<tr><td>Mercancías ≤ 5 m (solo indivisible)</td><td>1/3 de su longitud</td><td>1/3</td><td>0,40 m cada lado</td></tr>
<tr><td>Mercancías &gt; 5 m (solo indivisible)</td><td>2 m</td><td>3 m</td><td>0,40 m cada lado</td></tr>
<tr><td>Ancho &lt; 1 m (motos)</td><td>—</td><td>0,25 m</td><td>0,50 m desde el eje a cada lado</td></tr></table></div>
<p>Siempre sin pasar el total de 12 m de largo y 2,55 m de ancho. Un camión de 9 m solo puede añadir 3 m, repartidos sin pasar 2 delante ni 3 detrás.</p>
<div class="trick"><p>Turismo: puede llevar las dos cargas, pero solo detrás. Camión: carga a cualquier lado, pero solo indivisible (la que se rompe si la separas, como una tabla de surf).</p></div>
</section>
<section><h3>Señalizar la carga</h3>
<ul><li><b>Panel V-20</b> (50 × 50 cm, franjas rojas y blancas) detrás. Si ocupa todo el ancho: dos paneles en los extremos formando una V invertida.</li><li>De noche, en túneles o con mal tiempo: además, luz roja detrás y luz blanca delante.</li><li>Lateral: solo de noche (o túnel, o mal tiempo) y si sobresale más de 0,40 m desde el borde de la luz de posición: luz y reflectante rojos detrás y blancos delante, en cada extremo.</li><li>Vehículos de menos de 1 m de ancho no llevan V-20.</li></ul>
<p><b>Carga y descarga</b> en la vía: estacionado correctamente, por el lado más próximo al borde, con máxima celeridad, sin depositar la mercancía en calzada, arcén ni zona peatonal.</p>
</section>
<section><h3>Vehículos especiales y señales V</h3>
<p>Los especiales usan la vía solo para desplazarse y no llevan carga salvo los hechos para ello. La <b>V-2</b> (rotativa amarillo auto, sin preferencia) la encienden: grúas cuando obstaculizan, especiales trabajando, especiales circulando a 40 km/h o menos, y siempre al entrar en autopista o autovía. Si falla: luz de cruce + emergencia.</p>
<div class="tbl-wrap"><table><tr><th>Señal</th><th>Significado</th></tr>
<tr><td>V-1</td><td>Rotativa azul de prioritarios, visible a 50 m</td></tr><tr><td>V-2</td><td>Rotativa amarillo auto de especiales</td></tr><tr><td>V-3</td><td>Distintivos de policía</td></tr><tr><td>V-4</td><td>Limitación de velocidad del vehículo</td></tr><tr><td>V-5</td><td>Vehículo lento (motor que no supera 40 km/h)</td></tr><tr><td>V-6</td><td>Vehículo largo, más de 12 m</td></tr><tr><td>V-7</td><td>Servicio público</td></tr><tr><td>V-10</td><td>Transporte escolar</td></tr><tr><td>V-11</td><td>Mercancías peligrosas (placas naranjas)</td></tr><tr><td>V-12</td><td>Ensayos e investigación (+30 km/h)</td></tr><tr><td>V-13</td><td>Conductor novel (L)</td></tr><tr><td>V-14</td><td>Autoescuela</td></tr><tr><td>V-15</td><td>Persona con movilidad reducida</td></tr><tr><td>V-16</td><td>Luz amarilla de emergencia, lo más alto posible</td></tr><tr><td>V-19</td><td>Distintivo de ITV, ángulo superior derecho</td></tr><tr><td>V-20</td><td>Carga que sobresale por detrás</td></tr><tr><td>V-21</td><td>Transporte especial</td></tr><tr><td>V-22</td><td>Acompañamiento de ciclistas</td></tr><tr><td>V-23</td><td>Contorno de vehículos grandes</td></tr><tr><td>V-24</td><td>Grúa de auxilio en carretera</td></tr></table></div>
<p>Etiquetas ambientales, de menos a más contaminante: <b>0 · ECO · C · B</b>.</p>
</section>`,

{ short:"Alumbrado", title:"Alumbrado y señalización óptica",
notes:`
<section><h3>Ver y ser visto</h3>
<div class="tbl-wrap"><table><tr><th>Para ver</th><th>Para ser visto</th></tr>
<tr><td>Cruce (corta) · Carretera (larga) · Antiniebla delantero</td><td>Posición (y gálibo en vehículos anchos)</td></tr></table></div>
<p>Colores: delante <b>blanco</b>, detrás <b>rojo</b>, laterales <b>amarillo auto</b>. De noche circulando necesitas una luz para ver (cruce o carretera) y siempre posición.</p>
<p>Número: cruce, 2 (motos 1 o 2). Carretera, 2 o 4, siempre número par (motos 1 o 2). Posición, 2 delante y 2 detrás (motos 1 o 2), y laterales amarillas en vehículos de más de 6 m.</p>
</section>
<section><h3>¿Cruce o carretera?</h3>
<div class="tbl-wrap"><table><tr><th></th><th>Suficientemente iluminada</th><th>Insuficientemente iluminada</th></tr>
<tr><td>Fuera de poblado</td><td>Cruce</td><td>Carretera (por encima de 40 km/h y sin deslumbrar)</td></tr>
<tr><td>Poblado</td><td>Cruce</td><td>Cruce (carretera prohibida)</td></tr></table></div>
<p><b>Insuficientemente iluminada</b>: no distingues un vehículo oscuro a 50 m o no lees una matrícula a 10 m. Siempre más posición. El mismo cuadro vale para túneles. Si vas a menos de 40 puedes usar cualquiera de las dos.</p>
<ul><li>Si puedes deslumbrar a alguien (también peatones y animales), cambia a cruce.</li><li>Prohibida la de carretera con el vehículo parado o estacionado. Las ráfagas sí se permiten en poblado.</li><li>Las motos llevan siempre al menos la de cruce, de día y de noche.</li></ul>
</section>
<section><h3>Inmovilizados de noche</h3>
<div class="tbl-wrap"><table><tr><th></th><th>Interurbana</th><th>Travesía</th><th>Urbana</th></tr>
<tr><td>Detención</td><td>Posición</td><td>Posición</td><td>Posición</td></tr>
<tr><td>Parada</td><td>Posición</td><td>Posición</td><td>Posición</td></tr>
<tr><td>Estacionamiento</td><td>Posición</td><td>Solo si está insuficientemente iluminada</td><td>Solo si no se distingue a distancia prudencial</td></tr></table></div>
<div class="trap"><p>«Parado en travesía bien iluminada» lleva posición. Solo se pueden apagar las luces <b>estacionado</b>. Primero identifica si es detención, parada o estacionamiento.</p></div>
<p><b>Luz de estacionamiento</b> (opcional): enciende solo un lado. Sustituye a la de posición estacionado <b>en línea</b> en travesías insuficientemente iluminadas, no en batería.</p>
</section>
<section><h3>Antinieblas</h3>
<p>Delantero: opcional, sustituible por cruce o carretera. Trasero: obligatorio cuando toca, no tiene sustituto. En motos, los dos son opcionales.</p>
<div class="tbl-wrap"><table><tr><th>Condición</th><th>Ligera</th><th>Intensa / espesa</th></tr>
<tr><td>Niebla, nieve, humo o polvo</td><td>Delantero</td><td>Delantero + trasero</td></tr>
<tr><td>Lluvia</td><td>Ninguno</td><td>Intensa: delantero · Muy intensa: + trasero</td></tr></table></div>
<p>Sin mal tiempo están prohibidos, salvo el delantero si se dan a la vez: noche, carretera estrecha (6,5 m o menos) y curvas sucesivas.</p>
</section>
<section><h3>Otras luces</h3>
<ul><li><b>Gálibo</b>: marca la anchura; obligatoria con más de 2,10 m de ancho, opcional entre 1,80 y 2,10. Se enciende con la de posición.</li><li><b>Marcha atrás</b>: una o dos blancas, obligatoria salvo en motos.</li><li><b>Placa de matrícula</b>: blanca y solo trasera; no existe la delantera.</li><li><b>Emergencia</b>: obligatoria salvo motos (opcional). Frenazos en autopista o túneles, inmovilizaciones por emergencia, y transporte escolar mientras suben o bajan niños.</li><li><b>Freno</b>: rojo intenso, obligatoria en automóviles, remolques y ciclomotores.</li><li><b>Interior</b>: no obligatoria salvo servicio público; mejor apagada en marcha.</li><li><b>Catadióptricos</b>: traseros rojos obligatorios, delanteros blancos opcionales, laterales amarillos en vehículos de más de 6 m. Remolques: dos delanteros blancos y dos traseros rojos. Solo los traseros de remolque son <b>triangulares</b>.</li></ul>
</section>`,
qs:[
["En poblado, por una vía insuficientemente iluminada, ¿qué luz debe llevar?","La de cruce (más posición).","La de carretera.","Solo la de posición.","En poblado la luz de carretera está prohibida, esté o no iluminada la vía. La de posición sola no sirve para ver."],
["Una vía está insuficientemente iluminada cuando:","No se distingue un vehículo oscuro a 50 m o no se lee una matrícula a 10 m.","No se distingue un vehículo a 100 m.","No se lee una matrícula a 20 m.","Las cifras oficiales son 50 m para el vehículo oscuro y 10 m para la matrícula."],

["Con lluvia intensa (no muy intensa), ¿qué antiniebla puede usar?","El delantero, que puede sustituir por la de cruce o carretera.","El trasero.","Ninguno.","Con lluvia ligera ninguno; intensa permite el delantero; el trasero solo con lluvia muy intensa."],
["Está parado de noche en una travesía suficientemente iluminada. ¿Qué luces lleva?","Las de posición.","Ninguna.","Las de emergencia.","Detenido o parado de noche siempre posición. Solo estacionado en travesía bien iluminada se puede dejar sin luces."],
["La luz de gálibo es obligatoria en vehículos de anchura:","Superior a 2,10 m.","Superior a 1,80 m.","Superior a 2,55 m.","Entre 1,80 y 2,10 es opcional; obligatoria a partir de 2,10. 2,55 es la anchura máxima permitida."],

{ short:"Señales y agentes", title:"Señales de tráfico y agentes de circulación",
notes:`
<section><h3>Formas de las señales</h3>
<div class="tbl-wrap"><table><tr><th>Tipo</th><th>Forma</th></tr>
<tr><td>Peligro</td><td>Triángulo con vértice arriba</td></tr>
<tr><td>Prioridad</td><td>Formas únicas: ceda el paso (triángulo invertido), stop (octógono), calzada con preferencia (rombo). Se reconocen incluso por detrás.</td></tr>
<tr><td>Prohibición</td><td>Redonda, orla roja y fondo blanco</td></tr>
<tr><td>Obligación</td><td>Redonda azul</td></tr>
<tr><td>Indicación</td><td>Cuadrada o rectangular azul</td></tr>
<tr><td>Orientación</td><td>Carteles y carteles flecha</td></tr></table></div>
</section>
<section><h3>Jerarquía</h3>
<div class="tbl-wrap"><table><tr><th>Orden</th><th>Tipo</th></tr>
<tr><td class="big">1</td><td>Agentes de circulación</td></tr>
<tr><td class="big">2</td><td>Señales circunstanciales y de balizamiento</td></tr>
<tr><td class="big">3</td><td>Semáforos</td></tr>
<tr><td class="big">4</td><td>Señales verticales</td></tr>
<tr><td class="big">5</td><td>Marcas viales</td></tr></table></div>
<p>Si se contradicen dos de <b>distinto tipo</b>, gana la de mayor rango (semáforo verde frente a stop pintado: pasas). Si son del <b>mismo tipo</b>, la más restrictiva.</p>
<div class="trap"><p>Si no hay contradicción hay que cumplirlas todas: un semáforo de carril (informativo) con flecha verde y un stop se cumplen los dos.</p></div>
<p><b>Dónde está la señal</b>: a la derecha la obedecen todos. Solo a la izquierda: quienes siguen de frente o giran a la izquierda. A ambos lados: la derecha solo los que giran a la derecha. Cuenta adónde vas, no en qué carril estás.</p>
<p>Señal vertical: todo el ancho de la calzada. Pintada en el suelo: solo su carril, si los carriles están delimitados.</p>
</section>
<section><h3>Agentes</h3>
<div class="tbl-wrap"><table><tr><th>Señal</th><th>Significa</th></tr>
<tr><td>Brazo levantado</td><td>Alto a todos los que se acercan (sin entrar en la intersección; si ya estás dentro, sigue)</td></tr>
<tr><td>Brazos extendidos</td><td>Alto a quienes corte la trayectoria. Si baja el brazo, espera otra señal o cambio de postura.</td></tr>
<tr><td>Luz roja o amarilla balanceada</td><td>Alto al usuario al que se dirige</td></tr>
<tr><td>Brazo de arriba abajo</td><td>Disminuir la velocidad, todos</td></tr>
<tr><td>Silbato: toques cortos</td><td>Detenerse («me corto»)</td></tr>
<tr><td>Silbato: toque largo</td><td>Continuar («me largo»)</td></tr></table></div>
<p><b>Banderas</b>: amarilla, precaución; roja, carretera cortada salvo a los que acompaña (sal de la vía); verde, carretera abierta. No adelantes al agente de bandera verde: hasta ahí llega el tramo cortado.</p>
<p>Para detenerte: moto delante con el brazo indicando la derecha; coche detrás con ráfagas rojas o amarillas. Párate a la derecha y mantén la posición.</p>
<p><b>Pueden inmovilizar</b>: grave riesgo (también ir sin casco), negarse a la alcoholemia, sin seguro, OTA sin tique, emisiones excesivas, reforma no autorizada, exceso de ocupantes de más del 50 %.</p>
</section>
<section><h3>Circunstanciales y balizamiento</h3>
<p>Paneles de mensaje variable: obligan, avisan de peligros o informan. Se obedecen hasta que desaparece la causa o lo que indique el panel.</p>
<ul><li><b>Barreras</b>: fija, móvil o semibarrera (no pasar mientras se mueva). Panel direccional provisional: barrera que además indica por dónde ir.</li><li><b>Conos</b>: no se atraviesa la línea imaginaria que los une.</li><li><b>Luz roja fija aislada</b>: carretera cortada.</li><li>Guía: hito de vértice (bifurcación), hito de arista, balizas planas (obstáculo sólido), paneles de curva (1 a 3 según peligro) y captafaros.</li><li><b>Obras</b>: marcas y fondos amarillos. Significan lo mismo que las normales.</li></ul>
</section>
<section><h3>Semáforos</h3>
<div class="tbl-wrap"><table><tr><th>Luz</th><th>Qué hacer</th></tr>
<tr><td>Rojo</td><td>Detenerse</td></tr>
<tr><td>Verde</td><td>Pasar con preferencia</td></tr>
<tr><td>Ámbar fijo</td><td>Parar como en rojo, salvo que exija frenar bruscamente</td></tr>
<tr><td>Ámbar intermitente</td><td>Pasar con precaución, cumpliendo las demás señales (un stop, por ejemplo)</td></tr>
<tr><td>Flecha verde</td><td>Pasar en ese sentido, <b>sin</b> preferencia</td></tr>
<tr><td>Semáforo de carril</td><td>Informativo: aspa roja, carril no disponible; flecha verde abajo, disponible; flecha inclinada, cambia de carril</td></tr></table></div>
<p>Si estás en un carril que permite ir de frente y se enciende la flecha verde a la derecha, puedes esperar; pero si molestas a alguien que quiere girar, apártate. Si tu carril solo permite girar, sal ya aunque no molestes.</p>
</section>`,

["Semáforo en verde y un stop pintado en el suelo. ¿Qué hace?","Pasa, porque el semáforo prevalece.","Se detiene en el stop.","Cede el paso.","Hay contradicción entre señales de distinto tipo: gana la de mayor rango, el semáforo frente a la marca vial."],
["Stop pintado en el suelo y ceda el paso vertical. ¿A cuál obedece?","Al ceda el paso.","Al stop, por ser más restrictivo.","A los dos.","«La más restrictiva» solo se aplica entre señales del mismo tipo. Aquí son de distinto tipo y la vertical prevalece sobre la marca vial."],

["Toques cortos y frecuentes de silbato significan:","Que debe detenerse.","Que debe continuar.","Que debe acelerar.","Toques cortos, «me corto»: detenerse. Toque largo, «me largo»: continuar."],
["¿Puede adelantar a un agente que muestra bandera verde?","No.","Sí.","Solo si no vienen ciclistas.","La carretera está cortada desde la bandera roja hasta la verde. Adelantar al agente de la verde le metería en el tramo cortado."],
["Hay una señal solo en el lado izquierdo de la intersección. ¿Quién debe obedecerla?","Quienes siguen de frente y quienes giran a la izquierda.","Todos los conductores.","Solo los que giran a la izquierda.","Una señal a la derecha la obedecen todos; a la izquierda, frente e izquierda, que siempre comparten señal."],
["Una flecha verde encendida en un semáforo permite pasar:","En esa dirección, sin preferencia.","En esa dirección, con preferencia.","En cualquier dirección.","El círculo verde da preferencia; la flecha verde deja pasar pero cediendo a peatones y a la vía lateral."],
["Una policía en coche, detrás de usted, le hace ráfagas con luces rojas o amarillas. Significa:","Que se detenga a la derecha.","Que le deje paso.","Que acelere.","Es la forma de detener a un vehículo desde atrás. Una vez parado, quieto y manteniendo la posición."],
["Una señal de velocidad pintada en el carril derecho, con carriles delimitados, la deben cumplir:","Solo los que circulan por ese carril.","Todos los carriles.","Nadie, porque prevalecen las verticales.","Una vertical afecta a todo el ancho; pintada en el suelo, solo a su carril si están delimitados."]
],
fc:[["¿En qué orden prevalecen las señales?","Agentes > circunstanciales y balizamiento > semáforos > verticales > marcas viales."],["Si dos señales del mismo tipo se contradicen, ¿cuál manda?","Gana la más restrictiva."],["¿Qué significan los toques de silbato de un agente?","Cortos: detenerse. Largo: continuar."],["¿Qué significan las banderas amarilla, roja y verde?","Amarilla: precaución. Roja: cortada. Verde: abierta (no adelantar al agente)."],["¿Qué haces ante un semáforo en ámbar intermitente?","Pasar con precaución, cumpliendo las demás señales."],["¿Qué significa una luz roja fija aislada?","Carretera cortada."]]

{ short:"Documentación", title:"Documentación, permisos, ITV, seguro y puntos",
notes:`
<section><h3>Cuatro documentos</h3>
<p><b>Permiso de conducir</b>: de la persona (quien conduce). <b>Permiso de circulación</b>, <b>tarjeta ITV</b> y <b>seguro obligatorio</b>: del vehículo (quien circula). Originales, o fotocopias cotejadas o compulsadas.</p>
<div class="trick"><p>Quien <b>conduce</b> es la persona; quien <b>circula</b> (toca el suelo) es el coche.</p></div>
</section>
<section><h3>Permisos A y B</h3>
<div class="tbl-wrap"><table><tr><th>Permiso</th><th>Edad</th><th>Qué conduce</th></tr>
<tr><td class="big">AM</td><td>15</td><td>Ciclomotores de 2, 3 y 4 ruedas</td></tr>
<tr><td class="big">A1</td><td>16</td><td>Motos ≤ 125 cm³ y ≤ 11 kW; triciclos ≤ 15 kW</td></tr>
<tr><td class="big">A2</td><td>18</td><td>Motos ≤ 35 kW y ≤ 0,2 kW/kg, no derivadas de más del doble de potencia</td></tr>
<tr><td class="big">A</td><td>20</td><td>Cualquier moto, con 2 años de A2. Triciclos &gt; 15 kW desde los 21</td></tr>
<tr><td class="big">B</td><td>18</td><td>Ver abajo</td></tr></table></div>
<p><b>Con el B</b>: automóviles ≤ 3.500 kg y ≤ 9 plazas, con remolque ligero; furgones eléctricos hasta 4.250 kg con 2 años de B; cuadriciclos; triciclos (los de más de 15 kW, con 21 años); motos del A1 con <b>3 años</b> de B y solo en España; ciclomotores desde el primer día; especiales de obras y servicios ≤ 3.500 kg, 9 plazas y 40 km/h; agrícolas sin límite de peso, hasta 9 plazas.</p>
<div class="tbl-wrap"><table><tr><th>Remolque de más de 750 kg: suma de MMA</th><th>Permiso</th></tr>
<tr><td>Hasta 3.500 kg</td><td class="big">B</td></tr><tr><td>De 3.500 a 4.250 kg</td><td class="big">B96</td></tr><tr><td>Más de 4.250 kg</td><td class="big">B + E</td></tr></table></div>
<p>Renovación: cada <b>10 años</b> hasta los 65; después cada <b>5</b>.</p>
</section>
<section><h3>Puntos y sanciones</h3>
<div class="tbl-wrap"><table><tr><th>Momento</th><th>Puntos</th></tr>
<tr><td>Al obtener el primer permiso</td><td class="big">8</td></tr><tr><td>Tras 2 años sin perder puntos</td><td class="big">12</td></tr><tr><td>Tras 3 años más</td><td class="big">14</td></tr><tr><td>Tras otros 3 años (8 en total)</td><td class="big">15</td></tr></table></div>
<p>Leves: hasta 100 €, sin puntos. Graves: 200 €, con puntos. Muy graves: 500 €, con puntos. En un mismo día, máximo 8 puntos, salvo que alguna sea muy grave.</p>
<div class="tbl-wrap"><table><tr><th>Infracción</th><th>Puntos</th></tr>
<tr><td>Sin cinturón o sin casco</td><td class="big">4</td></tr><tr><td>Semáforo en rojo o stop</td><td class="big">4</td></tr><tr><td>Móvil sin manos libres</td><td class="big">6</td></tr><tr><td>Tirar objetos que puedan causar incendio (colilla)</td><td class="big">6</td></tr><tr><td>Positivo en alcohol</td><td class="big">4–6</td></tr></table></div>
</section>
<section><h3>Permiso de circulación</h3>
<p>Acredita que el vehículo está matriculado y puede circular. Recoge datos del titular, datos verificables del vehículo, matrícula, fecha de matriculación («edad» del coche) y MMA. Obligatorio para vehículos de motor y remolques de más de 750 kg. Solo se renueva si cambia algún dato: cambio de domicilio, <b>15 días</b>; compraventa, el comprador <b>30 días</b> y el vendedor <b>10</b>.</p>
<p>Automóviles: dos placas. Motos: solo trasera. Remolque ligero: sin matrícula propia. Remolque pesado: placa roja que empieza por R.</p>
</section>
<section><h3>ITV</h3>
<div class="tbl-wrap"><table><tr><th>Vehículo</th><th>Primera</th><th>Después</th></tr>
<tr><td>Turismo y autocaravana</td><td class="big">4 años</td><td>Cada 2 hasta 10 años; luego anual</td></tr>
<tr><td>Motocicleta</td><td class="big">4 años</td><td>Cada 2, siempre</td></tr>
<tr><td>Ciclomotor</td><td class="big">3 años</td><td>Cada 2, siempre</td></tr>
<tr><td>Camión o mixto ≤ 3.500 kg</td><td class="big">2 años</td><td>Cada 2 hasta 6; anual hasta 10; luego cada 6 meses</td></tr>
<tr><td>Remolque vivienda &gt; 750 kg</td><td class="big">6 años</td><td>Cada 2</td></tr>
<tr><td>Remolque &gt; 750 kg</td><td class="big">1 año</td><td>Anual hasta 10; luego cada 6 meses</td></tr>
<tr><td>Remolque ligero</td><td colspan="2">Tiene tarjeta ITV, pero no pasa revisiones</td></tr></table></div>
<p>Extraordinaria: reforma de importancia o reparación de un órgano esencial tras accidente, en <b>7 días</b>. <b>Favorable</b>: distintivo V-19 en el ángulo superior derecho del parabrisas. <b>Desfavorable</b>: menos de 2 meses para reparar, solo trayecto ITV-taller-ITV. <b>Negativa</b>: el coche sale en grúa. Si te pillan sin ITV: multa, te retiran el permiso de circulación y tienes 10 días. Responde el titular.</p>
</section>
<section><h3>Seguro obligatorio</h3>
<p>Obligatorio para vehículos de motor, ciclomotores, especiales y remolques de más de 750 kg (el ligero puede ir en el seguro del coche).</p>
<div class="tbl-wrap"><table><tr><th></th><th>Daños personales</th><th>Daños materiales</th></tr>
<tr><td>Vehículo culpable</td><td>Sí, salvo los del conductor culpable</td><td>No</td></tr>
<tr><td>Vehículo no culpable</td><td>Sí</td><td>Sí</td></tr></table></div>
<p>No cubre si el culpable da positivo en alcohol o drogas, el coche es robado, hay fuerza mayor extraña, ni los bienes de familiares hasta tercer grado. Sin seguro: sanción, inmovilización y un plazo para contratarlo. El justificante de pago acredita la vigencia.</p>
<p>Papeles: responde el titular. Hechos de la circulación: el conductor (si es menor, sus padres o tutores).</p>
</section>`,

["¿Puede conducir una moto de 125 cm³ con el permiso B?","Sí, con 3 años de antigüedad en el B y solo en España.","Sí, desde el primer día.","No, nunca.","Desde el primer día solo los ciclomotores. Las motos del A1 exigen 3 años de B y únicamente en territorio nacional."],
["¿Cubre el seguro obligatorio los daños materiales del vehículo culpable?","No.","Sí.","Solo si no hay heridos.","Al culpable solo le cubre lo personal de sus ocupantes, salvo el propio conductor. Lo material solo se cubre al no culpable."],
["Tras una compraventa, ¿qué plazo tiene el comprador para cambiar la titularidad?","30 días.","10 días.","15 días.","El vendedor tiene 10 días para notificarlo; 15 días es el plazo del cambio de domicilio."],
["Un conductor de 70 años debe renovar el permiso cada:","5 años.","10 años.","2 años.","Cada 10 años hasta los 65 y a partir de ahí cada 5."],
["Tras una reparación importante de la dirección por un accidente, ¿qué debe hacer?","Pasar una ITV extraordinaria en 7 días.","Nada, hasta la próxima ITV.","Esperar 2 meses.","Reformas de importancia y reparaciones de órganos esenciales exigen ITV extraordinaria en 7 días."]
],

{ short:"Estado del conductor", title:"Alcohol, drogas, fatiga, sueño y distracciones",
notes:`
<section><h3>Alcohol</h3>
<p>Interviene en casi la mitad de los accidentes. Es un depresor que afecta al cerebro y a la vista. Mezclado con fármacos potencia los efectos de ambos.</p>
<p><b>Afecta más</b>: según la difusión en sangre, a menos peso, a menores de 18 y mayores de 65, a mujeres, de noche (se elimina más lento), a inexpertos, según el estado emocional, a más cantidad, con bebidas destiladas frente a fermentadas, en ayunas y bebiendo rápido.</p>
<p><b>Efectos</b>: falsa seguridad, efecto túnel, más riesgo y peor pronóstico (es anticoagulante), más agresividad, y <b>aumenta el tiempo de reacción</b> (normal: unos 0,75 s), con lo que disminuye la capacidad de reacción.</p>
</section>
<section><h3>Tasas máximas</h3>
<div class="tbl-wrap"><table><tr><th>Conductor</th><th>Sangre (g/l)</th><th>Aire (mg/l)</th></tr>
<tr><td>General: automóviles ≤ 3.500 kg y 9 plazas con más de 2 años de permiso; camiones ≤ 3.500 kg; ciclistas</td><td class="big">0,5</td><td class="big">0,25</td></tr>
<tr><td>Noveles (2 primeros años), profesionales (bus, taxi, camión &gt; 3.500 kg), prioritarios, mercancías peligrosas, transportes especiales</td><td class="big">0,3</td><td class="big">0,15</td></tr>
<tr><td>Menores de edad</td><td class="big">0,0</td><td class="big">0,0</td></tr></table></div>
<div class="trick"><p>En aire es la <b>mitad</b> que en sangre, y se pasa de gramos a miligramos. La L se lleva 1 año desde el primer permiso; la tasa reducida dura 2 años desde ese primer permiso, no desde cada uno.</p></div>
<p>El alcohol alcanza su máximo una hora después de la última copa (entre 30 y 90 minutos) y se elimina lentamente, unos 0,15 a 0,20 g/l por hora. La mejor tasa es 0: afecta desde la primera gota.</p>
</section>
<section><h3>Pruebas de alcohol y drogas</h3>
<ul><li><b>Usuarios</b> (también peatones) implicados en un accidente.</li><li><b>Conductores</b> con síntomas evidentes, denunciados o en controles rutinarios.</li></ul>
<p>Si das positivo, segunda prueba pasados al menos 10 minutos (también si das negativo con síntomas). Puedes pedir contraanálisis en un centro médico: si sale positivo, lo pagas tú. Negarse es delito. Positivo: 4 a 6 puntos y, si es delito, vía judicial.</p>
</section>
<section><h3>Drogas</h3>
<div class="tbl-wrap"><table><tr><th>Sustancia</th><th>Efectos clave</th></tr>
<tr><td>Cannabis</td><td>Altera la percepción del tiempo y el espacio, falta de concentración, aumenta el tiempo de reacción, somnolencia</td></tr>
<tr><td>Cocaína</td><td>Agresividad, impulsividad, sobrevalora capacidades, altera la percepción</td></tr>
<tr><td>Anfetaminas</td><td>Sobrevaloración, impulsividad, violencia, alteraciones psicomotrices, <b>disminuye la sensación</b> de fatiga y sueño</td></tr>
<tr><td>LSD</td><td>Alucinaciones y distorsión de la realidad; efectos de <b>10 a 12 horas</b></td></tr>
<tr><td>Éxtasis</td><td>Ilusiones ópticas, visión borrosa, más sensibilidad al deslumbramiento, depresión, efecto rebote</td></tr></table></div>
<p>Prohibido conducir con drogas o medicamentos que alteren tu estado. Ninguna droga mejora el tiempo de reacción.</p>
</section>
<section><h3>Distracciones</h3>
<ul><li>Más frecuentes en jóvenes de 18 a 25 y mayores de 70; con niños a bordo; en verano y fines de semana (ocio); de día más que de noche; en carretera más que en poblado.</li><li>Ranking de vías: <b>familiares</b> &gt; complejas &gt; sencillas. En autopista, por monotonía.</li><li>Internas (sueño, cansancio, estrés) y externas (monotonía, tráfico, publicidad).</li></ul>
<div class="trap"><p>No confundas «familiar» (la que te conoces) con «sencilla» (fácil). Complejas ganan a sencillas; familiares ganan a complejas.</p></div>
<p><b>Fumar</b>: no está prohibido, pero duplica el riesgo de accidente. Tirar la colilla: 6 puntos y 200 €. <b>GPS</b>: en soporte, sin mover mucho la cabeza y lejos del airbag; prohibido programarlo en marcha; prevalece tu juicio, y el velocímetro sobre el GPS. <b>Móvil</b>: solo manos libres sin auriculares; conversaciones de menos de un minuto (hacia 1,5 min dejas de percibir señales); el accidente típico es salirse de la vía; lo mejor, parar. Un insecto dentro: detente antes de sacarlo.</p>
</section>
<section><h3>Enfermedad, sueño y vista</h3>
<p>No te automediques ni mezcles fármacos con alcohol. Alergia: los antihistamínicos dan somnolencia; ventanillas cerradas, filtros antipolen y aire no muy fuerte. A 100 km/h un estornudo de 1 s son unos 28 m sin mirar.</p>
<p><b>Sueño</b>: más sensibilidad al deslumbramiento, fatiga ocular, microsueños, más riesgo y más tiempo de reacción. Descansa cada <b>2 horas o 200 km</b> (20–30 min), habitáculo a 20–23 °C, café con moderación (efecto rebote). Horas críticas: 3 a 5 de la madrugada y 2 a 4 de la tarde. El mejor remedio: descansar al primer síntoma.</p>
<p><b>Vista</b>: el 90 % de la información entra por los ojos. Gafas de repuesto recomendables. El campo visual es mayor con objetos cercanos y en movimiento; se reduce con velocidad y alcohol.</p>
</section>`,

{ short:"Otros usuarios", title:"Otros usuarios, conducción preventiva y condiciones adversas",
notes:`
<section><h3>Conducción preventiva</h3>
<p>Ver lo que pasa y anticiparse a lo que es probable que pase. Necesita tres cosas: <b>ver</b> (saber dónde mirar), <b>espacio</b> y <b>anticipación</b>.</p>
<ul><li><b>Zona de incertidumbre</b>: donde un usuario puede moverse de forma inesperada. Peatón: igual en todas direcciones. Vehículo: mayor delante, menor a los lados y mínima detrás. Las bicis subiendo oscilan mucho. Mantente fuera de ella.</li><li><b>Ángulo muerto</b>: lo que no ves ni directamente ni por los espejos. Se vence girando la cabeza unos 90°.</li></ul>
</section>
<section><h3>Distancia de seguridad</h3>
<div class="tbl-wrap"><table><tr><th>Distancia</th><th>Cuándo</th></tr>
<tr><td><b>Corta</b>: no colisionar si el de delante frena</td><td>Poblado · caravana · más de un carril por sentido · donde está prohibido adelantar · cuando tú vas a adelantar</td></tr>
<tr><td><b>Larga</b>: además, que te adelanten con seguridad</td><td>Fuera de poblado, un carril por sentido, adelantamiento permitido y sin caravana</td></tr>
<tr><td><b>Túnel</b></td><td>100 m o 4 s · más de 3.500 kg: 150 m o 6 s (salvo para adelantar)</td></tr></table></div>
<p>Amplíala con pavimento malo, meteorología adversa o si estás cansado. Si alguien se te pega detrás: aumenta tu distancia delantera, señaliza antes y déjale pasar. Al detenerte, 2-3 m con el de delante; si eres el último en una parada inesperada, 5-6 m y vigilando el retrovisor.</p>
</section>
<section><h3>Peatones</h3>
<div class="tbl-wrap"><table><tr><th>Por dónde</th><th>Lado</th></tr>
<tr><td>Zona peatonal</td><td>La de la derecha si hay dos (dentro y fuera de poblado)</td></tr>
<tr><td>Arcén o calzada en poblado</td><td>El que convenga</td></tr>
<tr><td>Arcén o calzada fuera de poblado</td><td><b>Izquierda</b></td></tr></table></div>
<p>Prenda retrorreflectante (visible a 150 m) si se dan las tres: noche o mal tiempo, fuera de poblado y en calzada o arcén. <b>Peatones especiales</b> (silla de ruedas, empujar un ciclomotor u objeto voluminoso, cortejos) van siempre por la derecha; el cortejo de noche lleva luz blanca delante y roja detrás. Monopatines: a paso humano por zonas peatonales, sin ser arrastrados.</p>
</section>
<section><h3>Animales, voluminosos y dos ruedas</h3>
<p><b>Animales</b> de tiro, carga, silla y ganado: solo por la vía pública si no hay vía pecuaria. Prohibido entrar en zonas peatonales, conductor mayor de 18 años, por el arcén derecho (rebaños, la parte derecha de la calzada) y al paso.</p>
<p><b>Voluminosos</b>: prevé que se abran antes de girar; inicia el adelantamiento desde más lejos; reduce al cruzarte en vías estrechas; deja buena separación (succión).</p>
<p><b>Dos y tres ruedas</b>: poco visibles, inestables, sufren el viento. Casco obligatorio salvo certificado médico de la UE o moto con estructura de autoprotección (esta lleva cinturón). <b>Ciclistas</b>: casco siempre los menores de 16; los mayores, fuera de poblado, salvo certificado médico, rampas prolongadas, calor extremo o profesionales. De noche: catadióptrico rojo trasero, luz blanca delante y roja detrás; fuera de poblado, además, prenda reflectante.</p>
</section>
<section><h3>Conducción de noche y curvas</h3>
<p>Enciende antes de que anochezca y apaga después de amanecer. Debes poder detenerte dentro de la zona iluminada. De noche cuesta calcular distancias y velocidades.</p>
<ul><li>En una curva, quita primero la larga el que tiene la curva a su <b>derecha</b> (su haz apunta al otro sentido).</li><li>Adelantando de noche: el cambio de luces se hace cuando estáis en paralelo; el adelantado pasa a cruce y el que adelanta pone la larga.</li><li>Con mucha carga atrás, la luz de cruce también puede deslumbrar: bájala con el regulador.</li><li><b>Fuerza centrífuga</b>: más velocidad y más peso, más fuerza; más radio de curva, menos. Frena antes de la curva y acelera suavemente dentro.</li></ul>
</section>
<section><h3>Meteorología adversa</h3>
<div class="tbl-wrap"><table><tr><th>Situación</th><th>Claves</th></tr>
<tr><td>Lluvia</td><td>Las primeras gotas son las más peligrosas (aceite). Marcha más larga posible, suavidad, más distancia. <b>Aquaplaning</b>: más riesgo con más velocidad, más desgaste y neumático más ancho; menos con más peso. Gran charco: en primera y muy despacio; después, frena para secar los frenos.</td></tr>
<tr><td>Nieve</td><td>Marchas largas, salvo bajando puertos (corta). Sigue las rodadas, salvo capa fina. Arranca en segunda con las ruedas rectas. Gafas de sol por la reverberación.</td></tr>
<tr><td>Hielo</td><td>Adherencia casi nula; la frenada puede multiplicarse por 10. Ojo en días húmedos y fríos, en zonas húmedas y sombrías.</td></tr>
<tr><td>Cadenas</td><td>Señal de cadenas obligatoria: cadenas, dispositivos textiles autorizados o neumáticos de invierno (M+S o clavos ≤ 2 mm). Los sprays no sirven. Si solo tienes dos: en las ruedas <b>motrices</b> (tracción, delante; propulsión, detrás; 4x4, un mismo eje).</td></tr>
<tr><td>Niebla</td><td>Guíate por las marcas viales; la luz larga se permite pero no se aconseja (te deslumbras). Muy espesa: para en lugar seguro.</td></tr>
<tr><td>Viento lateral</td><td>Peor a rachas, en puentes, barrancos y taludes; afecta más a dos ruedas y con remolque. Reduce, marchas cortas, ventanillas cerradas, volante firme. Viento por la derecha: cuidado al adelantar voluminosos. Por la izquierda: al cruzarte con ellos.</td></tr>
<tr><td>Sol y calor</td><td>Parasol y gafas. A 35 °C el cuerpo va como con 0,5 g/l. Habitáculo a 20-23 °C, agua, ropa clara y evita las horas centrales.</td></tr></table></div>
</section>`,
