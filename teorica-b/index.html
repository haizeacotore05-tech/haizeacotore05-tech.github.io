{ short:"Mecánica y seguridad", title:"Mecánica, mantenimiento y seguridad del vehículo",
notes:`
<section><h3>Seguridad activa y pasiva</h3>
<div class="tbl-wrap"><table><tr><th>Activa: evita el accidente</th><th>Pasiva: protege en el accidente</th></tr>
<tr><td>Frenos (ABS, servofreno o BAS), alumbrado (xenón, adaptativas), neumáticos, dirección (asistida progresiva), suspensión, <b>chaleco reflectante</b>, ESP</td>
<td>Cinturón, airbag, reposacabezas, casco, sistemas de retención infantil, <b>carrocería</b></td></tr></table></div>
<p>El vehículo causa solo entre el 4 y el 13 % de los accidentes; cuando falla, suelen ser los <b>neumáticos</b>, el elemento que hay que revisar con más frecuencia.</p>
</section>
<section><h3>Cinturón y retención infantil</h3>
<p>Obligatorio dentro y fuera de poblado, delante y detrás. Reduce a la mitad el riesgo de muerte. Ceñido, no sobre ropa gruesa; banda abdominal sobre la pelvis. Respaldo recto y sin cojines para evitar el <b>efecto submarino</b>. Pinzas prohibidas. Revísalo o cámbialo tras un accidente. En autobús, si lo hay y mides más de 1,35 m.</p>
<div class="tbl-wrap"><table><tr><th>Exentos en todas partes</th><th>Exentos solo en poblado</th></tr>
<tr><td>Marcha atrás o estacionando · vehículo sin cinturones · certificado médico de la UE</td><td>Taxistas en servicio · repartidores con paradas próximas · prioritarios en servicio urgente (y sus acompañantes) · profesores de autoescuela</td></tr></table></div>
<div class="trick"><p><b>P</b>rofesional = <b>P</b>oblado. Si el supuesto lo puede vivir cualquiera, vale en todos los sitios.</p></div>
<p><b>Niños</b>: sistema según talla y peso. Hasta 1,35 m, obligatorio; entre 1,35 y 1,50, a elegir si el cinturón no pasa por el cuello; desde 1,50, cinturón. Detrás, salvo que no haya plazas traseras o estén todas ocupadas por niños con sistema. La más segura: trasera central, mejor mirando hacia atrás (en plaza con airbag, desconéctalo). En taxi en poblado, el niño puede ir sin sistema.</p>
</section>
<section><h3>Airbag, reposacabezas y casco</h3>
<ul><li><b>Airbag</b>: complementa al cinturón, no lo sustituye. Unos 25 cm del volante; 10 cm el de rodillas. Si no ha saltado y hay que sacar a un herido, desconecta antes la batería.</li><li><b>Reposacabezas</b>: borde superior a la altura de la parte alta de la cabeza y a menos de 4 cm de ella. Evita el latigazo cervical.</li><li><b>Casco</b>: homologado, de tu talla, mejor claro; cámbialo tras un accidente o una caída de más de 1,5 m.</li></ul>
</section>
<section><h3>Visibilidad y retrovisores</h3>
<p>Parabrisas <b>laminado</b> (se agrieta, sigues viendo) frente a templado (se hace añicos). Luneta: cristal trasero. Obligatorios limpia y lavaparabrisas; lavafaros solo con luces de xenón. Cambia escobillas que hacen ruido o vibran. Desempañar: calefacción hacia el parabrisas y luneta térmica.</p>
<div class="tbl-wrap"><table><tr><th>Retrovisores del turismo</th><th>Obligatorios</th></tr>
<tr><td>Norma general</td><td>Exterior izquierdo + interior</td></tr><tr><td>Si no ves por el interior</td><td>Los dos exteriores</td></tr><tr><td>Siempre</td><td>Exterior izquierdo</td></tr></table></div>
<p>Exteriores convexos: abarcan más, pero los vehículos están <b>más cerca de lo que parece</b>. Interior plano: más fiel. Mira cada 5 s en poblado o con mucho tráfico, cada 10 s fuera con poco tráfico, cada 15 s en autopista. Motos que superan 100 km/h: dos espejos; las demás y los ciclomotores, el izquierdo; quads, dos; ciclomotor de cuatro ruedas con carrocería, como un turismo.</p>
</section>
<section><h3>Neumáticos</h3>
<p>Llanta (metal) y cubierta (sin cámara: tubeless). Profundidad mínima del dibujo <b>1,6 mm</b> (aconsejable cambiar con menos de 2). Cámbialos a los <b>5 años</b>. Iguales al menos en el mismo eje, con códigos de carga y velocidad iguales o superiores.</p>
<div class="tbl-wrap"><table><tr><th>195</th><th>/55</th><th>R</th><th>15</th><th>85H</th><th>2411</th></tr>
<tr><td>Ancho de banda (mm)</td><td>Flanco (% del ancho)</td><td>Radial</td><td>Llanta (pulgadas)</td><td>Carga 85 · velocidad H</td><td>Semana 24 de 2011</td></tr></table></div>
<p><b>Presión</b>: la del fabricante, en frío, al menos una vez al mes; igual en verano e invierno (sí cambia con la carga). Rueda de repuesto: la más alta de las indicadas. Con presión baja: desgaste en los laterales, más consumo y más aquaplaning. Con presión alta: desgaste en el centro y más sufrimiento de la suspensión. En ambos casos, peor adherencia y estabilidad. Desgastan más: conducción agresiva, velocidad, verano, exceso de carga, mal pavimento y cadenas.</p>
</section>
<section><h3>Frenos</h3>
<ul><li><b>Servicio</b> (pedal): las cuatro ruedas. <b>Estacionamiento</b> (de mano): ruedas traseras. <b>Socorro</b>: actúa solo si falla el de servicio. Moto: dos frenos. Remolque ligero: ninguno; de más de 750 kg, servicio y estacionamiento.</li><li><b>Disco</b> (pastillas) mejor que <b>tambor</b> (zapatas): se calienta menos. <b>Freno motor</b>: soltar el acelerador o reducir marcha.</li><li><b>ABS</b>: evita el bloqueo para que sigas dirigiendo el coche; no pises el embrague hasta casi detenerte. <b>Servofreno o BAS</b>: añade fuerza en una frenada de emergencia; necesita el motor en marcha.</li><li>Fallo total bajando un puerto: freno motor, freno de mano progresivo, un camino en subida o rozar la pared si es seguro; cíñete a la derecha.</li></ul>
<div class="tbl-wrap"><table><tr><th>Derrape</th><th>Volante</th></tr><tr><td>Se va la parte trasera</td><td>Hacia el mismo lado</td></tr><tr><td>Se va la parte delantera</td><td>Hacia el lado contrario</td></tr></table></div>
</section>
<section><h3>Mantenimiento</h3>
<ul><li><b>Batería</b>: con el motor en marcha la energía la da el alternador. Si tiene mantenimiento, rellena con <b>agua destilada</b>. Bornes limpios con vaselina.</li><li><b>Aceite</b>: se mide con motor parado, frío y en llano; se cambia en caliente (cae mejor) cuando diga el fabricante; el usado, a un punto limpio. Testigo apagado = engrase correcto.</li><li><b>Frenos</b>: latiguillos sin fugas; nivel y cambio del líquido según el fabricante.</li><li><b>Suspensión</b> gastada: desgaste irregular de neumáticos, cabeceo al frenar o acelerar, luces que oscilan; la frenada puede alargarse hasta un 50 %.</li><li><b>Puesta a punto</b> tras las vacaciones, sobre todo de playa (correa de distribución).</li></ul>
<div class="tbl-wrap"><table><tr><th>Humo del escape</th><th>Problema</th></tr><tr><td>Blanco</td><td>Agua en la combustión</td></tr><tr><td>Azulado</td><td>Se quema aceite</td></tr><tr><td>Negro</td><td>Mala combustión (filtro de aire sucio, caudalímetro)</td></tr></table></div>
<p><b>A bordo</b> (turismos y camiones ≤ 3.500 kg): rueda de repuesto o alternativa, chaleco y V-16. Con remolque, extintor. Motos, nada. Rueda de uso temporal: respeta sus condiciones (por ejemplo, 80 km/h y 50 km).</p>
</section>
<section><h3>Conducción eficiente</h3>
<p>Arranca sin acelerar; en gasolina sal enseguida, en diésel espera unos segundos. Primera solo unos 2 s o 6 m. Cambia de marcha a 2.000-2.500 rpm en gasolina y a 1.500-2.000 en diésel; usa la marcha más larga posible y salta marchas. Velocidad moderada, sin acelerones ni frenazos, sin exceso de carga, ventanillas cerradas (efecto paracaídas), climatizador moderado, apaga en retenciones largas. <b>Errores</b>: bajar en punto muerto, usar otro combustible, apagar en paradas cortas.</p>
</section>`,

{ short:"Accidentes y auxilio", title:"Accidentes de tráfico y primeros auxilios",
notes:`
<section><h3>Datos de los accidentes</h3>
<p>La OMS los considera un <b>problema de salud pública</b> mundial (son una de las principales causas de muerte en países desarrollados, no en todo el mundo). Producen impacto económico y social, y son evitables.</p>
<div class="tbl-wrap"><table><tr><th>Factor</th><th>Responsable en</th></tr>
<tr><td>Humano</td><td class="big">70–90 %</td></tr><tr><td>Vía y entorno</td><td class="big">10–35 %</td></tr><tr><td>Vehículo</td><td class="big">4–13 %</td></tr></table></div>
<div class="tbl-wrap"><table><tr><th>Coste</th><th>Ejemplos</th></tr>
<tr><td>Sanitario</td><td>Primeros auxilios, ambulancia, hospital, rehabilitación</td></tr>
<tr><td>Administrativo</td><td>Bomberos, policía, seguros, grúas, limpieza</td></tr>
<tr><td>Humano</td><td>Años de vida perdidos, sufrimiento propio y de allegados, pérdida de capacidad productiva</td></tr>
<tr><td>Material</td><td>Vehículos, mobiliario urbano y <b>daños al medio ambiente</b></td></tr></table></div>
<p>Los pagamos todos. Fuera de poblado hay más accidentes en rectas que en curvas. Más en verano y fines de semana; entre semana, a la salida del trabajo. Autopistas: menos accidentes, pero más graves. Hay más <b>accidentes con víctimas en poblado</b>, pero más <b>víctimas</b> (y más graves) fuera.</p>
</section>
<section><h3>Distancias</h3>
<div class="tbl-wrap"><table><tr><th>Distancia</th><th>Qué es</th><th>Le afecta</th></tr>
<tr><td>De reacción</td><td>Lo recorrido durante el tiempo de reacción</td><td>Velocidad (el tiempo no varía con ella; la distancia sí) y estado del conductor</td></tr>
<tr><td>De frenado</td><td>Desde pisar el freno hasta parar</td><td>Todo: conductor, vehículo y vía. ×2 en mojado, ×10 en hielo</td></tr>
<tr><td>De detención</td><td>Reacción + frenado</td><td>—</td></tr></table></div>
</section>
<section><h3>Grupos vulnerables</h3>
<ul><li><b>Jóvenes de 15 a 29</b>: el tráfico es su principal causa de muerte. Ocio, noche y madrugada, grandes ciudades, verano, Navidad y fines de semana; más accidentes acompañados; asumen riesgos y creen controlar alcohol y velocidad.</li><li><b>Mayores</b>: pérdida de capacidades, medicación, peor recuperación; vulnerables en incorporaciones e intersecciones y, como peatones, en calzadas anchas. Sufren menos atropellos si van con niños.</li><li><b>Peatones</b>: los más vulnerables; la mayoría de atropellados no cometía infracción. Niños: el 30 % de los fallecidos iban a pie, más atropellos a la salida del colegio, menos campo visual por su altura, hasta los 7 años no localizan bien los sonidos, los menores de 10 se distraen más y creen que si ven, les ven.</li><li><b>Dos ruedas</b>: motos en intersecciones con mal tiempo; bicis en intersecciones con buen tiempo, en rectas, en verano y fines de semana.</li></ul>
</section>
<section><h3>Qué hacer: P-A-S</h3>
<div class="tbl-wrap"><table><tr><th>Paso</th><th>Qué hacer</th></tr>
<tr><td class="big">P</td><td><b>Proteger</b>: primero a ti (chaleco), luego el lugar (V-16, señalizar), luego a las víctimas. Freno de mano y quitar el contacto de los accidentados.</td></tr>
<tr><td class="big">A</td><td><b>Avisar</b> al 112: lugar, número de heridos, estado. Funciona en toda Europa, sin cobertura de tu compañía y sin saldo.</td></tr>
<tr><td class="big">S</td><td><b>Socorrer</b>.</td></tr></table></div>
<p>Auxiliar es obligatorio para implicados, testigos y quien tenga conocimiento. Llama a las autoridades si hay muertos o heridos graves, o si no hay acuerdo sobre la culpa; entonces no muevas nada. Da tus datos si te los piden.</p>
<p><b>Mortalidad</b>: inmediata, en la <b>hora de oro</b> (la primera hora, cuando se pueden salvar vidas; en ella muere en torno al 75 %) y tardía.</p>
</section>
<section><h3>Socorrer</h3>
<p>No mover a los heridos (salvo peligro de incendio o RCP), no darles de beber ni medicamentos, no hacerles andar, taparlos para que no pierdan calor, aflojar la ropa, mantener el eje cabeza-cuello-tronco. No quitar el casco al motorista salvo para la RCP, con dos personas. Si no sabes técnicas, quédate dando apoyo emocional.</p>
<p><b>Posición lateral de seguridad</b>: inconsciente que respira y vomita o sangra por boca o nariz, o si tienes que dejarlo solo. Si no, maniobra frente-mentón para abrir la vía aérea.</p>
<div class="tbl-wrap"><table><tr><th>RCP</th><th>Adulto</th><th>Niño</th><th>Bebé</th></tr>
<tr><td>Inicio</td><td>Compresiones</td><td>5 insuflaciones de rescate</td><td>5 de rescate, boca a boca-nariz</td></tr>
<tr><td>Ritmo</td><td colspan="3">30 compresiones : 2 insuflaciones, al menos 100 por minuto</td></tr>
<tr><td>Cómo</td><td>Dos manos, brazos rectos, tercio inferior del esternón, 4-5 cm</td><td>Una mano, un tercio del tórax</td><td>Dos dedos</td></tr></table></div>
<p>Sobre superficie dura, hasta que llegue ayuda, se recupere o te agotes.</p>
</section>
<section><h3>Hemorragias, quemaduras y fracturas</h3>
<p><b>Externa</b>, por orden: presión directa (si la gasa se empapa, pon otra encima sin quitarla); elevar el miembro; presión sobre la arteria; torniquete como último recurso (no aflojar, anotar la hora, dejarlo visible).</p>
<p><b>Interna</b>: confusión, palidez y pulso rápido y débil = shock. Posición antishock (piernas elevadas) y al hospital. <b>Exteriorizada</b> (oído, nariz, boca): no taponar; en posición lateral, sobre el oído que sangra.</p>
<p>Arterial: rojo vivo. Venosa: rojo oscuro. Capilar: la menos grave.</p>
<p><b>Quemaduras</b>: refrigerar con agua, cubrir con apósitos húmedos, elevar. No vendar dos superficies juntas, no pinchar ampollas, no quitar la ropa pegada, no poner pomadas. <b>Fracturas</b> (dolor, impotencia, crepitación, deformidad): inmovilizar.</p>
</section>`,
qs:[
["El orden correcto de actuación en un accidente es:","Proteger, avisar y socorrer.","Avisar, proteger y socorrer.","Socorrer, avisar y proteger.","Regla PAS: primero proteges (a ti, al lugar y a las víctimas) para que no haya más heridos; después avisas al 112 y por último socorres."],
["¿Qué factor provoca la mayoría de los accidentes?","El factor humano.","La vía y su entorno.","El vehículo.","Humano entre 70 y 90 %; vía, 10-35 %; vehículo, solo 4-13 %."],
["En la reanimación cardiopulmonar de un adulto, el ritmo es:","30 compresiones y 2 insuflaciones.","15 compresiones y 2 insuflaciones.","5 compresiones y 1 insuflación.","30:2 a un ritmo de al menos 100 compresiones por minuto, tanto en adultos como en niños."],
["Un herido inconsciente que respira está vomitando. Le coloca:","En posición lateral de seguridad.","Boca arriba.","Sentado.","Boca arriba podría ahogarse con el vómito. Sentado no está indicado para un inconsciente."],
["La gasa con la que presiona una herida se empapa de sangre. Usted:","Coloca otra encima sin retirar la primera.","La retira y pone una nueva.","Retira todo para ver la herida.","La primera ya está coagulando y taponando; quitarla reabriría la herida."],
["Un herido sangra por el oído. Usted:","No tapona el oído.","Le tapona el oído con una gasa.","Le pone algodón para cortar la sangre.","Es una hemorragia interna exteriorizada: hay que dejar salir la sangre, o se acumularía dentro."],
["Si ha tenido que hacer un torniquete:","Anota la hora, no lo afloja y lo deja visible.","Lo afloja cada 10 minutos.","Lo tapa con ropa.","Es la última medida. Lo afloja el médico; tú anotas la hora y lo dejas a la vista."],
["Ante una quemadura, lo correcto es:","Refrigerarla con agua.","Pinchar las ampollas.","Aplicar una pomada.","Pinchar ampollas o poner pomadas abre la puerta a infecciones."],
["Un motorista herido lleva casco. Como norma general:","No se le quita, salvo que haga falta para la RCP, entre dos personas.","Se le quita siempre para que respire.","Se le quita para comprobar si sangra.","Quitarlo puede dañar la columna; solo si impide la reanimación y con técnica adecuada."],
["Sobre hielo, la distancia de frenado puede multiplicarse por:","10.","2.","4.","Por 2 en mojado y por 10 en hielo."],
["¿Influye la velocidad en el tiempo de reacción?","No, pero sí en la distancia de reacción.","Sí, lo aumenta.","No influye en nada.","Tardas lo mismo en reaccionar a 50 que a 100, pero a 100 recorres más metros mientras reaccionas."],
["¿Dónde hay más víctimas graves y mortales?","Fuera de poblado.","Dentro de poblado.","Igual en ambos.","Hay más accidentes con víctimas en poblado, pero fuera, por la velocidad, hay más víctimas y más graves."],
["Tras un accidente sin heridos graves, ¿cuándo hay que llamar a las autoridades?","Si no hay acuerdo sobre quién es el culpable.","Siempre.","Nunca.","Se avisa si hay muertos, heridos graves o desacuerdo sobre la culpa. Con heridos leves y acuerdo no es necesario."],
["Los daños al medio ambiente en un accidente se consideran costes:","Materiales.","Administrativos.","Humanos.","Aceite, combustible derramado o la contaminación de la retención se catalogan como costes materiales."]
],
fc:[["¿Qué significa P-A-S?","Proteger · Avisar (112) · Socorrer."],["¿Qué factores causan los accidentes y en qué porcentaje?","Humano 70-90 % · vía 10-35 % · vehículo 4-13 %."],["¿Cómo se hace la RCP?","30:2, ≥ 100/min, 4-5 cm. Niños: 5 de rescate primero."],["¿Qué pasos sigues ante una hemorragia externa?","Presión directa → elevar → presión arterial → torniquete."],["¿Qué haces si un herido sangra por el oído?","No taponar. Lateral sobre ese oído."],["¿Qué es la hora de oro?","Primera hora tras el accidente: ahí se salvan vidas."],["¿Qué es la distancia de detención?","Reacción + frenado."]]

qs:[
["¿Qué indica esta señal?","Entrada prohibida a todo vehículo.","Circulación prohibida en ambos sentidos.","Fin de todas las prohibiciones.","Disco rojo con barra blanca: no se puede entrar. El círculo blanco con borde rojo y vacío es circulación prohibida en ambos sentidos; el fin de prohibiciones es blanco con rayas diagonales.","R-101"],
["¿Qué indica esta señal?","Circulación prohibida en ambos sentidos para todo vehículo.","Entrada prohibida.","Calle sin salida.","Círculo blanco vacío con borde rojo: prohibido circular en los dos sentidos. La de entrada prohibida es un disco rojo con barra blanca.","R-100"],
["¿Qué prohíbe esta señal?","Parar y estacionar.","Solo estacionar.","Circular a vehículos.","Aspa roja sobre fondo azul: ni parar ni estacionar. Con una sola barra solo se prohíbe estacionar.","R-307"],
["¿Qué prohíbe esta señal?","Estacionar; se permite parar.","Parar y estacionar.","Circular por el carril.","Una sola barra: prohibido estacionar, pero puedes parar menos de 2 minutos sin abandonar el vehículo. El aspa prohibiría las dos cosas.","R-308"],
["¿Qué indica esta señal?","Velocidad máxima de 60 km/h.","Velocidad mínima de 60 km/h.","Velocidad aconsejada de 60 km/h.","Número negro con borde rojo: máxima. La mínima es número blanco sobre círculo azul y la aconsejada es una señal cuadrada.","R-301"],
["¿Qué indica esta señal?","Velocidad mínima de 30 km/h.","Velocidad máxima de 30 km/h.","Zona 30 recomendada.","Círculo azul es obligación: obliga a ir al menos a 30. La máxima tiene borde rojo.","R-411"],
["¿Qué indica esta señal?","Fin de la limitación de velocidad de 60.","Limitación de velocidad a 60.","Velocidad mínima de 60.","Las rayas diagonales finas sobre fondo blanco y el número en gris indican que termina esa limitación.","R-501"],
["¿Qué indica esta señal?","Fin de todas las prohibiciones.","Prohibición de todo tipo de maniobras.","Fin de autopista.","Disco blanco con rayas diagonales y sin símbolo: terminan todas las prohibiciones anteriores.","R-500"],
["¿Qué prohíbe esta señal?","Que un vehículo de motor adelante a otro de motor invadiendo el sentido contrario.","Cualquier adelantamiento, aunque no se invada el sentido contrario.","Adelantar a bicicletas y ciclomotores.","Si no hace falta invadir el sentido contrario, se puede adelantar. Y a ciclos y ciclomotores (que no son vehículos de motor) se les puede adelantar sin peligro.","R-305"],
["¿Qué indica esta señal?","Que se acaba la prohibición de adelantar.","Que está prohibido adelantar.","Que solo pueden adelantar turismos.","Mismos coches que en la prohibición, pero en gris y con rayas diagonales: es una señal de fin.","R-502"],
["Ante esta señal, si no viene ningún vehículo:","Puede pasar sin detenerse.","Debe detenerse siempre.","Debe parar y hacer una doble detención.","Es ceda el paso. Detenerse siempre es lo que obliga el stop.","R-1"],
["Ante esta señal debe:","Detenerse siempre y ceder el paso.","Detenerse solo si vienen vehículos.","Reducir la velocidad sin detenerse.","Stop: detención obligatoria aunque no venga nadie. Si desde ahí no ve, hace una segunda detención donde tenga visibilidad.","R-2"],
["¿Qué le indica esta señal?","Que tiene prioridad en todas las intersecciones hasta su señal de fin.","Que tiene prioridad solo en la próxima intersección.","Peligro por obras.","El rombo amarillo es calzada con prioridad. La prioridad solo en la próxima intersección la da el triángulo con la cruz.","R-3"],
["¿Qué le indica esta señal?","Fin de la calzada con prioridad.","Calzada con prioridad.","Fin de todas las prohibiciones.","El rombo con rayas negras marca dónde termina la prioridad.","R-4"],
["¿Qué le indica esta señal?","Peligro por proximidad de una intersección donde usted tiene prioridad.","Calzada con prioridad hasta su fin.","Cruce de calles sin prioridad.","Es una señal de peligro: avisa de la intersección y le da prioridad solo en ella, no en las siguientes.","P-1"],
["En un paso estrecho encuentra esta señal. ¿Quién pasa primero?","Los que vienen de frente.","Usted.","El que entre primero.","Círculo con borde rojo: es una prohibición. Su flecha es la roja; tiene prioridad el sentido contrario.","R-5"],
["En un paso estrecho encuentra esta señal. ¿Quién pasa primero?","Usted.","Los que vienen de frente.","El vehículo más grande.","Cuadrada azul: es informativa y le da prioridad. Su flecha es la blanca y grande.","R-6"],
["¿Qué indica esta señal?","Paso a nivel sin barreras.","Paso a nivel con barreras.","Tranvía en la vía.","Locomotora = sin barreras. Si hubiese barreras, la señal mostraría una valla.","P-7"],
["¿Qué indica esta señal?","Paso a nivel con barreras.","Paso a nivel sin barreras.","Obras en la calzada.","La valla representa las barreras. Sin barreras se dibuja una locomotora.","P-8"],
["¿Qué le obliga esta señal?","A seguir solo en la dirección de la flecha.","A ceder el paso a los que vienen de frente.","Nada; solo informa de que la calle es de sentido único.","Círculo azul: obligación. La de sentido único informativa es cuadrada.","R-400"],
["¿Qué indica esta señal?","Que debe pasar el obstáculo por el lado que indica la flecha.","Que debe girar a la derecha.","Que la calzada se estrecha.","Es paso obligatorio: la flecha diagonal hacia abajo indica por qué lado rodear el obstáculo.","R-401"],
["¿Qué indica esta señal?","Intersección de sentido giratorio obligatorio.","Peligro por proximidad de una rotonda.","Prohibido el cambio de sentido.","Al ser azul y redonda obliga a circular en el sentido de las flechas. La de peligro es triangular.","R-402"],
["¿Qué indica esta señal?","Peligro por proximidad de una intersección de circulación giratoria.","Obligación de circular por la rotonda.","Prohibido girar.","Triángulo de peligro con las flechas en círculo: avisa de que se acerca una rotonda.","P-4"],
["¿Qué indica esta señal?","Que, tras un tramo de sentido único, la vía pasa a ser de doble sentido.","Que tiene prioridad sobre el sentido contrario.","Que hay un carril reversible.","Es de peligro y avisa de circulación en los dos sentidos. La prioridad en pasos estrechos se señaliza con las señales redonda o cuadrada.","P-25"],
["¿Qué indica esta señal?","Estrechamiento de la calzada.","Curva peligrosa.","Paso estrecho con prioridad.","Las dos líneas que se acercan indican que la calzada se estrecha por ambos lados.","P-17"],
["Esta señal con un panel que dice «cañada» significa:","Que los animales tienen prioridad.","Solo que puede haber animales en la vía.","Que está prohibido el paso de animales.","Sin panel solo avisa del peligro. Con el panel de cañada, los animales tienen prioridad, como los peatones en un paso.","P-23"],
["¿Qué indica esta señal?","La situación de un paso para peatones.","Un lugar frecuentado por peatones.","Una zona peatonal obligatoria.","Cuadrada azul: informa de dónde está el paso. El triángulo con un peatón avisa de que suele haber gente andando, aunque no haya paso.","S-13"],
["¿Qué indica esta señal?","Peligro por la proximidad de un lugar frecuentado por peatones.","Un paso para peatones.","Prohibido el paso de peatones.","Triángulo de peligro: avisa. El paso de peatones se indica con la señal cuadrada azul.","P-20"],

/* =========================================================
   ESTADO
   ========================================================= */
const KEY="teoricaB.v1";
let S;
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=Object.assign({q:{},wrong:[],known:{},sims:[]},d||{});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
let theme=null;try{theme=localStorage.getItem(KEY+".theme")}catch(e){}
if(theme)document.documentElement.setAttribute("data-theme",theme);

const ALL=[];T.forEach((t,ti)=>t.qs.forEach((q,qi)=>ALL.push(ti+"-"+qi)));
const getQ=id=>{const[a,b]=id.split("-").map(Number);return{t:a,i:b,d:T[a].qs[b]}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(a,b)=>b?Math.round(a*100/b):0;
function topicDone(ti){return T[ti].qs.filter((_,qi)=>(S.q[ti+"-"+qi]||{}).ok>0).length}
function totalDone(){return ALL.filter(id=>(S.q[id]||{}).ok>0).length}

let view={name:"home"};
let quiz=null, deck=null, timerId=null;

/* =========================================================
   QUIZ
   ========================================================= */
function makeItem(id){const{d,t}=getQ(id);return{id,t,img:d[5],q:d[0],exp:d[4],opts:shuffle([{x:d[1],ok:true},{x:d[2]},{x:d[3]}]),chosen:null,done:false}}
function startQuiz(ids,o){
  clearInterval(timerId);
  quiz=Object.assign({items:ids.map(makeItem),i:0,finished:false,instant:true,title:"Test"},o);
  if(quiz.timed){quiz.endAt=Date.now()+quiz.timed*60000;timerId=setInterval(tick,1000)}
}
function record(it){const ok=it.opts[it.chosen]&&it.opts[it.chosen].ok;const s=S.q[it.id]||(S.q[it.id]={ok:0,ko:0});
  if(ok){s.ok++;S.wrong=S.wrong.filter(x=>x!==it.id)}else{s.ko++;if(!S.wrong.includes(it.id))S.wrong.push(it.id)}}
function choose(k){const it=quiz.items[quiz.i];if(it.done)return;it.chosen=k;
  if(quiz.instant){it.done=true;record(it);save()}render()}
function nextQ(){const it=quiz.items[quiz.i];if(it.chosen===null)return;
  if(!quiz.instant)it.done=true;
  if(quiz.i<quiz.items.length-1){quiz.i++;render();scrollTop()}else finish()}
function finish(){clearInterval(timerId);
  if(!quiz.instant){quiz.items.forEach(it=>{if(it.chosen!==null){it.done=true;record(it)}})}
  quiz.finished=true;
  const f=fails();
  if(quiz.sim){S.sims.unshift({d:new Date().toISOString(),f,n:quiz.items.length});S.sims=S.sims.slice(0,20)}
  save();render();scrollTop()}
const isOk=it=>it.chosen!==null&&it.opts[it.chosen].ok;
const fails=()=>quiz.items.filter(it=>it.done&&!isOk(it)).length+(quiz.finished?quiz.items.filter(it=>it.chosen===null).length:0);
function tick(){if(!quiz||quiz.finished){clearInterval(timerId);return}
  const r=quiz.endAt-Date.now();if(r<=0){finish();return}
  const el=document.getElementById("timer");if(el)el.textContent=fmt(r)}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* =========================================================
   RENDER
   ========================================================= */
const $=s=>document.querySelector(s);
function scrollTop(){window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}

function renderSide(){
  const on=n=>view.name===n?" on":"";
  let h=`<h4>Estudio</h4><nav class="nav">
  <button class="${on("home")}" data-a="home"><span class="n">◆</span><span class="lbl">Inicio y progreso</span><span></span></button>
  <button class="${on("sim")}" data-a="sim"><span class="n">30</span><span class="lbl">Simulacro DGT</span><span></span></button>
  <button class="${on("fails")}" data-a="fails"><span class="n">✕</span><span class="lbl">Repasar fallos</span><span class="pc num">${S.wrong.length}</span></button>
  <button class="${on("mix")}" data-a="mix"><span class="n">⇄</span><span class="lbl">Tarjetas mezcladas</span><span></span></button>
  </nav><h4>Temas</h4><nav class="nav">`;
  T.forEach((t,i)=>{h+=`<button class="${view.name==="topic"&&view.t===i?"on":""}" data-a="topic" data-t="${i}"><span class="n">${i+1}</span><span class="lbl">${t.short}</span><span class="pc num">${pct(topicDone(i),t.qs.length)}%</span></button>`});
  $("#side").innerHTML=h+"</nav>";
}

function renderHome(){
  const done=totalDone(), sims=S.sims, passed=sims.filter(s=>s.f<=3).length;
  let h=`<div><div class="eyebrow">Examen teórico · Permiso B</div><h1 class="h1">Tu teórica, tema a tema</h1>
  <p class="lead">Apuntes con trucos, tests estilo DGT con la explicación de cada opción y tarjetas para repasar. En el examen real hay 30 preguntas y apruebas con 3 fallos como máximo.</p></div>
  <div class="stats">
   <div class="stat"><div class="v num">${pct(done,ALL.length)}%</div><div class="k">Temario dominado · ${Object.keys(S.known).length} tarjetas sabidas</div></div>
   <div class="stat"><div class="v num">${done}<small style="font-size:18px;color:var(--muted)">/${ALL.length}</small></div><div class="k">Preguntas acertadas</div></div>
   <div class="stat"><div class="v num">${passed}<small style="font-size:18px;color:var(--muted)">/${sims.length}</small></div><div class="k">Simulacros aprobados</div></div>
   <div class="stat"><div class="v num" style="color:${S.wrong.length?"var(--red)":"inherit"}">${S.wrong.length}</div><div class="k">Fallos por repasar</div></div>
  </div>
  <div class="actions">
   <button class="act main" data-a="sim"><b>Simulacro DGT</b><span>30 preguntas de todo el temario · 30 minutos · corrección al final</span></button>
   <button class="act" data-a="fails"><b>Repasar fallos</b><span>${S.wrong.length?S.wrong.length+" preguntas que fallaste":"Aún no tienes fallos guardados"}</span></button>
   <button class="act" data-a="mix"><b>Tarjetas mezcladas</b><span>Repaso rápido de datos clave y señales de todos los temas</span></button>
  </div>
  <div><h2 style="font-size:26px;margin-bottom:10px">Temas</h2><div class="grid">`;
  T.forEach((t,i)=>{const d=topicDone(i),p=pct(d,t.qs.length);
    h+=`<button class="tcard" data-a="topic" data-t="${i}"><span class="badge">${i+1}</span><b>${t.title}</b><div><div class="bar"><i style="width:${p}%"></i></div><small class="num">${d}/${t.qs.length} acertadas · ${t.fc.length} tarjetas</small></div></button>`});
  h+=`</div></div>`;
  h+=`<div class="panel"><h2 style="font-size:24px;margin-bottom:8px">Últimos simulacros</h2>`;
  if(!sims.length)h+=`<p class="empty" style="margin:0">Todavía no has hecho ninguno. Cuando termines uno, aparecerá aquí con su resultado.</p>`;
  else{h+=`<div class="sims">`+sims.slice(0,6).map(s=>`<div><span class="num">${new Date(s.d).toLocaleDateString("es-ES",{day:"numeric",month:"short"})} · ${new Date(s.d).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}</span><span class="num">${s.f} fallos · <span class="${s.f<=3?"ok-t":"ko-t"}">${s.f<=3?"APTO":"NO APTO"}</span></span></div>`).join("")+`</div>`}
  h+=`<div class="row" style="margin-top:14px"><button class="btn" data-a="reset">Borrar mi progreso</button><span class="kbd">El progreso se guarda solo en este dispositivo.</span></div></div>`;
  return h;
}

function renderTopic(){
  const t=T[view.t], tab=view.tab||"notes";
  let h=`<div class="thead"><span class="badge">${view.t+1}</span><div><div class="eyebrow">Tema ${String(view.t+1).padStart(2,"0")} de ${T.length}</div><h1 class="h1" style="font-size:clamp(26px,4.5vw,36px)">${t.title}</h1></div></div>
  <div class="tabs" role="tablist">
   <button class="${tab==="notes"?"on":""}" data-a="tab" data-v="notes">Apuntes</button>
   <button class="${tab==="test"?"on":""}" data-a="tab" data-v="test">Test (${t.qs.length})</button>
   <button class="${tab==="cards"?"on":""}" data-a="tab" data-v="cards">Tarjetas (${t.fc.length})</button></div>`;
  if(tab==="notes"){h+=`<div class="notes">${t.notes}</div><div class="row"><button class="btn pri" data-a="tab" data-v="test">Hacer el test del tema</button>${view.t<T.length-1?`<button class="btn" data-a="topic" data-t="${view.t+1}">Siguiente tema</button>`:""}</div>`}
  else if(tab==="test")h+=renderQuiz();
  else h+=renderCards();
  return h;
}

function renderQuiz(){
  if(!quiz)return"";
  if(quiz.finished)return renderSummary();
  const it=quiz.items[quiz.i], n=quiz.items.length, f=fails();
  let pips="";
  if(quiz.instant){for(let k=0;k<3;k++)pips+=`<span class="pip ${k<f?"x":""}"></span>`;
    pips=`<div class="pips" aria-label="Fallos">${pips}<span class="num">${f} fallo${f===1?"":"s"}${f>3?" · ya serías no apto":""}</span></div>`}
  else pips=`<div class="pips">Tiempo <span class="timer num" id="timer">${fmt(quiz.endAt-Date.now())}</span></div>`;
  let h=`<div class="qtop"><span class="qcount num">Pregunta ${quiz.i+1} de ${n}</span>${pips}</div>
  <div class="pbar"><i style="width:${(quiz.i)/n*100}%"></i></div>
  <div class="qcard"><div class="qtag">${quiz.sim||quiz.mix?"Tema "+(it.t+1)+" · "+T[it.t].short:quiz.title}</div>${it.img?`<div class="qimg">${sign(it.img)}</div>`:""}<p class="qtext">${it.q}</p><div class="opts">`;
  it.opts.forEach((o,k)=>{let c="";
    if(quiz.instant&&it.done){if(o.ok)c="ok";else if(k===it.chosen)c="ko"}else if(k===it.chosen)c="sel";
    h+=`<button class="opt ${c}" data-a="choose" data-k="${k}" ${quiz.instant&&it.done?"disabled":""}><span class="l">${"ABC"[k]}</span><span>${o.x}</span></button>`});
  h+=`</div>`;
  if(quiz.instant&&it.done){const ok=isOk(it);
    h+=`<div class="fb ${ok?"good":"bad"}"><h4>${ok?"Correcta":"Incorrecta"}</h4><p>${ok?"":"La respuesta correcta es <b>"+it.opts.find(o=>o.ok).x+"</b> "}${it.exp}</p></div>`}
  h+=`</div><div class="row" style="justify-content:space-between"><button class="btn" data-a="quit">Salir del test</button>
  <span class="kbd">Teclas 1-3 para responder · Intro para seguir</span>
  <button class="btn pri" data-a="next" ${it.chosen===null||(quiz.instant&&!it.done)?"disabled":""}>${quiz.i<n-1?"Siguiente":"Ver resultado"}</button></div>`;
  return h;
}

function renderSummary(){
  const n=quiz.items.length, f=fails(), ok=n-f, apto=f<=3;
  let h=`<div class="panel"><div class="verdict"><span class="stamp ${apto?"ok":"ko"}">${apto?"APTO":"NO APTO"}</span>
  <div><div class="qcount num">${ok} aciertos · ${f} fallos de ${n}</div><p class="lead" style="margin:4px 0 0">${apto?"Has quedado dentro del límite de 3 fallos de la DGT.":"Has superado el límite de 3 fallos. Repasa las explicaciones de abajo y vuelve a intentarlo."}</p></div></div>
  <div class="row" style="margin-top:16px"><button class="btn pri" data-a="again">Repetir</button>${S.wrong.length?`<button class="btn" data-a="fails">Repasar fallos (${S.wrong.length})</button>`:""}<button class="btn" data-a="home">Ir al inicio</button></div></div>`;
  const bad=quiz.items.filter(it=>!isOk(it));
  if(bad.length){h+=`<h2 style="font-size:24px">Revisa tus fallos</h2><div class="rev">`+bad.map(it=>`<div class="item">${it.img?`<div class="mini">${sign(it.img)}</div>`:""}<b>${it.q}</b>
   ${it.chosen!==null?`<div class="yours">Tu respuesta: ${it.opts[it.chosen].x}</div>`:`<div class="yours">Sin responder</div>`}
   <div class="ans">Correcta: ${it.opts.find(o=>o.ok).x}</div><p>${it.exp}</p></div>`).join("")+`</div>`}
  return h;
}

function fcControls(){const c=deck.cards[deck.i];
  if(!deck.flip)return `<button class="btn" data-a="fprev" ${deck.i===0?"disabled":""}>Anterior</button><button class="btn pri" data-a="flip">Ver respuesta</button><button class="btn" data-a="fshuffle">Barajar</button>`;
  return `<span class="kbd">¿Te la sabías?</span><div class="row"><button class="btn" data-a="fno">No me la sabía</button><button class="btn pri" data-a="fyes">Me la sabía</button></div>`}
function renderCards(){
  if(!deck||!deck.cards.length)return`<p class="empty">No hay tarjetas.</p>`;
  const c=deck.cards[deck.i], kn=deck.cards.filter(x=>S.known[x.id]).length;
  return `<p class="lead" style="margin:0">Lee la pregunta e intenta responder de memoria. Luego toca la tarjeta para ver la respuesta y marca si te la sabías. Las que marques como sabidas cuentan en tu progreso.</p>
  <div class="qtop"><span class="qcount num">Tarjeta ${deck.i+1} de ${deck.cards.length}</span><span class="known num">Te sabes ${kn} de ${deck.cards.length}</span></div>
  <div class="pbar"><i style="width:${(deck.i+1)/deck.cards.length*100}%"></i></div>
  <div class="fcwrap"><button class="flash ${deck.flip?"flip":""} ${c.img?"tall":""}" data-a="flip" aria-label="Girar tarjeta">
   <div class="face front"><small>${deck.mix?"Tema "+(c.t+1)+" · "+T[c.t].short:"Pregunta"}${S.known[c.id]?" · ya te la sabes":""}</small>${c.img?`<div class="fcimg">${sign(c.img)}</div>`:""}<div class="txt">${c.f||"¿Qué significa esta señal?"}</div><small style="opacity:.75">Toca para ver la respuesta</small></div>
   <div class="face back"><small style="color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--font-body);font-size:14px">${c.f||"¿Qué significa esta señal?"}</small><small style="color:var(--sign)">Respuesta</small><div class="txt">${c.b}</div></div>
  </button></div>
  <div class="row" id="fcctl" style="justify-content:space-between">${fcControls()}</div>
  <p class="kbd" style="margin:0">Teclado: espacio para girar · flechas para moverte</p>`;
}
function flipCard(){deck.flip=!deck.flip;const el=document.querySelector(".flash");if(el)el.classList.toggle("flip",deck.flip);const ct=document.getElementById("fcctl");if(ct)ct.innerHTML=fcControls()}

function render(){
  renderSide();
  let h="";
  if(view.name==="home")h=renderHome();
  else if(view.name==="topic")h=renderTopic();
  else if(view.name==="sim"||view.name==="fails"){
    h=`<div><div class="eyebrow">${view.name==="sim"?"Simulacro de examen":"Repaso"}</div><h1 class="h1">${view.name==="sim"?"Simulacro DGT":"Repasar fallos"}</h1>
    <p class="lead">${view.name==="sim"?"30 preguntas de todos los temas, 30 minutos y corrección al final, como en el examen. Puedes cambiar la respuesta hasta pulsar Siguiente.":"Preguntas que has fallado. Al acertarlas desaparecen de esta lista."}</p></div>`;
    if(quiz)h+=renderQuiz();else h+=`<div class="panel"><p class="empty" style="margin:0 0 12px">No tienes fallos guardados. Haz algún test y los que falles aparecerán aquí.</p><button class="btn pri" data-a="sim">Hacer un simulacro</button></div>`;
  }
  else if(view.name==="mix"){h=`<div><div class="eyebrow">Repaso rápido</div><h1 class="h1">Tarjetas mezcladas</h1><p class="lead">Datos clave de todo el temario: tasas, velocidades, plazos, puntos y trucos.</p></div>`+renderCards()}
  $("#app").innerHTML=h;
  $("#themeBtn").textContent=isDark()?"Modo claro":"Modo oscuro";
}
function isDark(){const a=document.documentElement.getAttribute("data-theme");if(a)return a==="dark";return matchMedia("(prefers-color-scheme: dark)").matches}

/* =========================================================
   NAVEGACIÓN Y EVENTOS
   ========================================================= */
function makeDeck(list,mix){deck={cards:list,i:0,flip:false,mix}}
function topicDeck(ti){return T[ti].fc.map((c,k)=>({id:ti+"-"+k,t:ti,f:c[0],b:c[1],img:c[2]}))}
function go(v){clearInterval(timerId);view=v;quiz=null;deck=null;
  if(v.name==="topic"){if(v.tab==="test")startQuiz(shuffle(T[v.t].qs.map((_,i)=>v.t+"-"+i)),{title:"Test del tema "+(v.t+1)});
    if(v.tab==="cards")makeDeck(topicDeck(v.t),false)}
  if(v.name==="sim"){let ids=[];T.forEach((t,ti)=>{ids.push(...shuffle(t.qs.map((_,i)=>ti+"-"+i)).slice(0,2))});
    ids.push(...shuffle(ALL.filter(x=>!ids.includes(x))).slice(0,30-ids.length));startQuiz(shuffle(ids),{instant:false,sim:true,timed:30,title:"Simulacro"})}
  if(v.name==="fails"&&S.wrong.length)startQuiz(shuffle(S.wrong).slice(0,30),{mix:true,title:"Repaso de fallos"});
  if(v.name==="mix"){let all=[];T.forEach((_,ti)=>all.push(...topicDeck(ti)));makeDeck(shuffle(all),true)}
  document.body.classList.remove("nav-open");render();scrollTop();
  try{if(v.name==="topic")history.replaceState(null,"","#tema"+(v.t+1));else history.replaceState(null,"","#"+v.name)}catch(e){}
}
let resetArmed=false;
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="menu"){document.body.classList.toggle("nav-open");return}
  if(a==="theme"){const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem(KEY+".theme",n)}catch(e){}render();return}
  if(a==="home")return go({name:"home"});
  if(a==="sim")return go({name:"sim"});
  if(a==="fails")return go({name:"fails"});
  if(a==="mix")return go({name:"mix"});
  if(a==="topic")return go({name:"topic",t:+b.dataset.t,tab:"notes"});
  if(a==="tab")return go({name:"topic",t:view.t,tab:b.dataset.v});
  if(a==="choose")return choose(+b.dataset.k);
  if(a==="next")return nextQ();
  if(a==="quit")return view.name==="topic"?go({name:"topic",t:view.t,tab:"notes"}):go({name:"home"});
  if(a==="again")return go(Object.assign({},view));
  if(a==="flip"){flipCard();return}
  if(a==="fprev"){deck.i=Math.max(0,deck.i-1);deck.flip=false;return render()}
  if(a==="fyes"||a==="fno"){const c=deck.cards[deck.i];if(a==="fyes")S.known[c.id]=true;else delete S.known[c.id];save();
    if(deck.i<deck.cards.length-1){deck.i++}deck.flip=false;return render()}
  if(a==="fshuffle"){deck.cards=shuffle(deck.cards);deck.i=0;deck.flip=false;return render()}
  if(a==="reset"){if(!resetArmed){resetArmed=true;b.textContent="Pulsa otra vez para confirmar";setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent="Borrar mi progreso"},4000);return}
    resetArmed=false;S={q:{},wrong:[],known:{},sims:[]};save();render()}
});
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;
  if(quiz&&!quiz.finished&&(view.name!=="topic"||view.tab==="test")){
    if(["1","2","3"].includes(e.key)){choose(+e.key-1);e.preventDefault()}
    else if(e.key==="Enter"){nextQ();e.preventDefault()}}
  else if(deck){if(e.key===" "){flipCard();e.preventDefault()}
    else if(e.key==="ArrowRight"&&deck.i<deck.cards.length-1){deck.i++;deck.flip=false;render()}
    else if(e.key==="ArrowLeft"&&deck.i>0){deck.i--;deck.flip=false;render()}}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",render);
(function boot(){const h=(location.hash||"").slice(1);const m=h.match(/^tema(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=T.length)go({name:"topic",t:+m[1]-1,tab:"notes"});
  else if(["sim","fails","mix"].includes(h))go({name:h});else render()})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
